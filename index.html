      textEditPopup.style.left = Math.max(4, left) + 'px';
      textEditPopup.style.top  = Math.max(4, top)  + 'px';
      requestAnimationFrame(() => { textEditInput.focus(); textEditInput.select(); });
    }
    function applyTextEdit() {
      if (!textEditTarget) return;
      const val = textEditInput.value;
      if (textEditTarget.type === 'item') {
        const item = placedItems.find(i => i.id === textEditTarget.id);
        if (item) { item.text = val; const td = document.getElementById(textEditTarget.id)?.querySelector('.placed-text'); if (td) td.textContent = val; }
      } else if (textEditTarget.type === 'arrow') {
        const arrow = arrows.find(a => a.id === textEditTarget.id);
        if (arrow) { arrow.text = val; redrawArrows(); }
      } else if (textEditTarget.type === 'group') {
        const grp = groups.find(g => g.id === textEditTarget.id);
        if (grp) {
          grp.label = val;
          const el = document.getElementById(textEditTarget.id);
          const lbl = el?.querySelector('.group-label');
          if (lbl) lbl.textContent = val || '(グループ)';
          // 新規作成時にOKを押したらラベルを表示する（文字があれば）
          if (textEditIsNewGroup) {
            grp.hideLabel = !val.trim();
            if (lbl) lbl.style.display = val.trim() ? '' : 'none';
          }
        }
      }
      textEditIsNewGroup = false;
      closeTextEdit();
    }
    function closeTextEdit() {
      // キャンセル時：新規グループ名入力だったらラベルを非表示にする
      if (textEditIsNewGroup && textEditTarget?.type === 'group') {
        const grp = groups.find(g => g.id === textEditTarget.id);
        if (grp) {
          grp.hideLabel = true;
          const lbl = document.getElementById(grp.id)?.querySelector('.group-label');
          if (lbl) lbl.style.display = 'none';
        }
      }
      textEditIsNewGroup = false;
      textEditPopup.style.display = 'none'; textEditTarget = null;
    }
    textEditOk.addEventListener('click', applyTextEdit);
    textEditCancel.addEventListener('click', closeTextEdit);
    textEditInput.addEventListener('keydown', e => { if (e.key === 'Enter') applyTextEdit(); if (e.key === 'Escape') closeTextEdit(); });

    // ===== Delete =====
    function deleteItem(itemId) {
      placedItems = placedItems.filter(i => i.id !== itemId);
      arrows = arrows.filter(a => a.fromId !== itemId && a.toId !== itemId);
      document.getElementById(itemId)?.remove();
      redrawArrows();
    }
    function deleteArrow(arrowId) { arrows = arrows.filter(a => a.id !== arrowId); redrawArrows(); }
    function deleteGroup(groupId) {
      if (groupEditId === groupId) exitGroupEditMode();
      groups = groups.filter(g => g.id !== groupId); document.getElementById(groupId)?.remove();
    }

    // ===== Canvas growth =====
    function growCanvas(needW, needH) {
      if (needW > canvasArea.offsetWidth)  canvasArea.style.width = needW + 'px';
      if (needH > canvasArea.offsetHeight) canvasArea.style.minHeight = needH + 'px';
    }

    // ===== ④ Group box feature =====
    const groupModeBtn = document.getElementById('group-mode-btn');
    groupModeBtn.addEventListener('click', () => {
      groupMode = !groupMode;
      groupModeBtn.classList.toggle('active', groupMode);
      canvasArea.classList.toggle('group-draw-mode', groupMode);
    });

function createGroupEl(grp) {
      const el = document.createElement('div');
      el.className = 'group-box'; el.id = grp.id;
      el.style.left   = grp.x + 'px';  el.style.top    = grp.y + 'px';
      el.style.width  = grp.w + 'px';  el.style.height = grp.h + 'px';
      applyGroupColorEl(el, grp.colorIdx, grp.hideBorder);

      const lbl = document.createElement('div');
      lbl.className   = 'group-label';
      lbl.textContent = grp.label || '(グループ)';
      const c = GROUP_COLORS[grp.colorIdx ?? 0];
      lbl.style.background = c.border;
      el.appendChild(lbl);

      // Click label → popup
      lbl.addEventListener('click', e => { e.stopPropagation(); showGroupPopup(grp.id, e.clientX, e.clientY); });
      lbl.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); showGroupPopup(grp.id, e.clientX, e.clientY); });

      // Click group body → popup（編集モード中はスキップ）
      el.addEventListener('click', e => {
        if (groupEditId === grp.id) return;
        if (e.target.closest('.group-label') || e.target.closest('.placed-item')) return;
        e.stopPropagation();
        showGroupPopup(grp.id, e.clientX, e.clientY);
      });
      el.addEventListener('contextmenu', e => {
        if (groupEditId === grp.id) return;
        if (e.target.closest('.group-label') || e.target.closest('.placed-item')) return;
        e.preventDefault(); e.stopPropagation();
        showGroupPopup(grp.id, e.clientX, e.clientY);
      });
      // Drag label → move group
      lbl.addEventListener('pointerdown', e => {
        if (e.button === 2) return;
        e.preventDefault(); e.stopPropagation();
        const startX = e.clientX, startY = e.clientY;
        const origX = grp.x, origY = grp.y;
        let moved = false;

        const onMove = ev => {
          const dx = ev.clientX - startX, dy = ev.clientY - startY;
          if (!moved && Math.hypot(dx, dy) < 4) return;
          moved = true;
          grp.x = Math.max(0, origX + dx); grp.y = Math.max(0, origY + dy);
          el.style.left = grp.x + 'px';   el.style.top  = grp.y + 'px';
        };
        const onUp = ev => {
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup',   onUp);
          if (!moved) showGroupPopup(grp.id, ev.clientX, ev.clientY);
        };
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup',   onUp);
      });

      return el;
    }

    function applyGroupColor(grp) {
      const el = document.getElementById(grp.id); if (!el) return;
      applyGroupColorEl(el, grp.colorIdx, grp.hideBorder);
      const lbl = el.querySelector('.group-label');
      if (lbl) lbl.style.background = GROUP_COLORS[grp.colorIdx ?? 0].border;
    }

    function applyGroupColorEl(el, colorIdx, hideBorder) {
      const c = GROUP_COLORS[colorIdx ?? 0];
      el.style.borderColor = hideBorder ? 'transparent' : c.border;
      el.style.background  = c.bg;
    }

    // Drawing group on canvas (in group mode)
    let groupPreview = null, groupDrawStart = null;

    canvasArea.addEventListener('pointerdown', e => {
      if (!groupMode) return;
      if (e.target.closest('.placed-item') || e.target.closest('.group-label') || e.target.closest('.group-box')) return;
      e.preventDefault();
      const rect = canvasArea.getBoundingClientRect();
      const sx = e.clientX - rect.left + canvasWrap.scrollLeft;
      const sy = e.clientY - rect.top  + canvasWrap.scrollTop;
      groupDrawStart = { sx, sy };

      groupPreview = document.createElement('div');
      groupPreview.className = 'group-preview';
      groupPreview.style.left = sx + 'px'; groupPreview.style.top = sy + 'px';
      groupPreview.style.width = '0'; groupPreview.style.height = '0';
      canvasArea.appendChild(groupPreview);

      const onMove = ev => {
        if (!groupPreview) return;
        const r = canvasArea.getBoundingClientRect();
        const cx = ev.clientX - r.left + canvasWrap.scrollLeft;
        const cy = ev.clientY - r.top  + canvasWrap.scrollTop;
        const x = Math.min(cx, groupDrawStart.sx), y = Math.min(cy, groupDrawStart.sy);
        const w = Math.abs(cx - groupDrawStart.sx), h = Math.abs(cy - groupDrawStart.sy);
        groupPreview.style.left = x + 'px'; groupPreview.style.top  = y + 'px';
        groupPreview.style.width  = w + 'px'; groupPreview.style.height = h + 'px';
      };
      const onUp = ev => {
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup',   onUp);
        if (groupPreview) { groupPreview.remove(); groupPreview = null; }

        const r = canvasArea.getBoundingClientRect();
        const cx = ev.clientX - r.left + canvasWrap.scrollLeft;
        const cy = ev.clientY - r.top  + canvasWrap.scrollTop;
        const x = Math.min(cx, groupDrawStart.sx), y = Math.min(cy, groupDrawStart.sy);
        const w = Math.abs(cx - groupDrawStart.sx), h = Math.abs(cy - groupDrawStart.sy);
        groupDrawStart = null;

        if (w < 40 || h < 30) return; // too small, ignore
        const id  = `group-${nextGroupId++}`;
        const grp = { id, x, y, w, h, label: 'グループ', colorIdx: 0, hideBorder: true, hideLabel: false };
        groups.push(grp);
        const el = createGroupEl(grp);
        // Insert BEFORE arrow-svg so groups are behind items
        canvasArea.insertBefore(el, arrowSvg);
        growCanvas(x + w + 20, y + h + 30);
        // Open text edit for label (cancel → hide label)
        textEditIsNewGroup = true;
        openTextEdit({ type: 'group', id });
      };
      document.addEventListener('pointermove', onMove, { passive: true });
      document.addEventListener('pointerup',   onUp);
    });

    // Inject font as base64 at startup so html2canvas clone can use it
    (async () => {
      try {
        const resp = await fetch('font/mihoyo-zenzero.ttf');
        const buf  = await resp.arrayBuffer();
        const u8   = new Uint8Array(buf);
        let bin = '', chunk = 8192;
        for (let i = 0; i < u8.length; i += chunk)
          bin += String.fromCharCode(...u8.subarray(i, Math.min(i + chunk, u8.length)));
        const dataUrl = `data:font/truetype;base64,${btoa(bin)}`;
        const s = document.createElement('style');
        s.id = 'font-b64-inject';
        s.textContent = `@font-face{font-family:'MihoyoZenZero';src:url('${dataUrl}')format('truetype');}`;
        document.head.appendChild(s);
      } catch(e) {}
    })();

    // ===== Save image =====
    // 相関図名入力がキャンバス操作を邪魔しないよう伝播を止める
    document.getElementById('chart-title-input')?.addEventListener('pointerdown', e => e.stopPropagation());

    document.getElementById('save-btn').addEventListener('click', async () => {
      closePopup(); closeTextEdit();
      canvasArea.style.backgroundImage = 'none';
      const midDots = arrowSvg.querySelectorAll('.midpoint-dot');
      midDots.forEach(d => d.style.display = 'none');
      await document.fonts.ready;
      try {
        const dpr = Math.max(window.devicePixelRatio || 1, 2); // 最低2倍で高画質
        const fontStyleText = document.getElementById('font-b64-inject')?.textContent || '';
        const cvs = await html2canvas(canvasArea, {
          useCORS: true, allowTaint: true, scrollX: 0, scrollY: 0,
          backgroundColor: '#ffffff', scale: dpr,
          onclone: doc => {
            if (fontStyleText) {
              const s = doc.createElement('style');
              s.textContent = fontStyleText;
              doc.head.appendChild(s);
            }
          },
        });

        // Crop to bounding box (座標をdpr倍に換算)
        const PAD = 28;
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const item of placedItems) {
          if (item.type === 'junction') continue;
          const sz = iSz(item), w = dW(item);
          minX = Math.min(minX, item.x); minY = Math.min(minY, item.y);
          maxX = Math.max(maxX, item.x + w); maxY = Math.max(maxY, item.y + sz + 18);
        }
        for (const grp of groups) {
          minX = Math.min(minX, grp.x); minY = Math.min(minY, grp.y);
          maxX = Math.max(maxX, grp.x + grp.w); maxY = Math.max(maxY, grp.y + grp.h);
        }

        let cropped = cvs;
        if (isFinite(minX) && maxX > minX && maxY > minY) {
          const x0 = Math.max(0, Math.floor((minX - PAD) * dpr));
          const y0 = Math.max(0, Math.floor((minY - PAD) * dpr));
          const x1 = Math.min(cvs.width,  Math.ceil((maxX + PAD) * dpr));
          const y1 = Math.min(cvs.height, Math.ceil((maxY + PAD) * dpr));
          const cw = x1 - x0, ch = y1 - y0;
          if (cw > 0 && ch > 0) {
            const tmp = document.createElement('canvas');
            tmp.width = cw; tmp.height = ch;
            tmp.getContext('2d').drawImage(cvs, x0, y0, cw, ch, 0, 0, cw, ch);
            cropped = tmp;
          }
        }

        // ヘッダーを描画して合成
        const chartName = document.getElementById('chart-title-input')?.value?.trim() || '';
        const HDR_CSS = chartName ? 62 : 46;
        const HDR = Math.round(HDR_CSS * dpr);
        const BORDER = Math.round(3 * dpr);
        const finalCvs = document.createElement('canvas');
        finalCvs.width = cropped.width; finalCvs.height = cropped.height + HDR;
        const ctx = finalCvs.getContext('2d');

        // ヘッダー背景
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, finalCvs.width, HDR);
        ctx.fillStyle = '#ffcc00';
        ctx.fillRect(0, HDR - BORDER, finalCvs.width, BORDER);

        // フォント
        const ff = document.fonts.check('12px MihoyoZenZero')
          ? "'MihoyoZenZero',sans-serif" : 'sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = '#333333';

        if (chartName) {
          ctx.font = `bold ${Math.round(15 * dpr)}px ${ff}`;
          ctx.fillText('原神・スタレの相関図メーカー', finalCvs.width / 2, Math.round(22 * dpr));
          ctx.font = `${Math.round(13 * dpr)}px ${ff}`;
          ctx.fillStyle = '#555555';
          ctx.fillText(`「${chartName}」`, finalCvs.width / 2, Math.round(46 * dpr));
        } else {
          ctx.font = `bold ${Math.round(15 * dpr)}px ${ff}`;
          ctx.fillText('原神・スタレの相関図メーカー', finalCvs.width / 2, Math.round(26 * dpr));
        }

        // チャート内容を下に合成
        ctx.drawImage(cropped, 0, HDR);

        const now = new Date(), padN = n => String(n).padStart(2, '0');
        const ts = `${now.getFullYear()}${padN(now.getMonth()+1)}${padN(now.getDate())}_`
                 + `${padN(now.getHours())}${padN(now.getMinutes())}${padN(now.getSeconds())}`;
        const a = document.createElement('a');
        a.download = `相関図_${ts}.png`; a.href = finalCvs.toDataURL('image/png'); a.click();
      } catch (err) { alert('保存に失敗しました: ' + err.message); }
      finally {
        canvasArea.style.backgroundImage = '';
        midDots.forEach(d => d.style.display = '');
      }
    });

    // ===== Upload custom image =====
    // ===== Upload with crop modal =====
    document.getElementById('upload-thumb').addEventListener('click', () => document.getElementById('file-input').click());

    let cropNativeImg = null, cropScale = 1, cropOX = 0, cropOY = 0;
    let cropPendingName = '';
    const cropModal  = document.getElementById('crop-modal');
    const cropFrame  = document.getElementById('crop-frame');
    const cropImgEl  = document.getElementById('crop-img-el');
    const cropZoom   = document.getElementById('crop-zoom');
    const CROP_SIZE  = 280; // frame width/height (px)

    function openCropModal(dataUrl, fileName) {
      cropPendingName = fileName;
      cropNativeImg = new Image();
      cropNativeImg.onload = () => {
        // Initial scale: shorter side fills the frame
        cropScale = CROP_SIZE / Math.min(cropNativeImg.width, cropNativeImg.height);
        cropOX = (CROP_SIZE - cropNativeImg.width  * cropScale) / 2;
        cropOY = (CROP_SIZE - cropNativeImg.height * cropScale) / 2;
        cropZoom.min   = (CROP_SIZE / Math.max(cropNativeImg.width, cropNativeImg.height)).toFixed(3);
        cropZoom.max   = 10;
        cropZoom.value = cropScale;
        applyCropTransform();
        cropModal.classList.add('open');
      };
      cropNativeImg.src = dataUrl;
    }

    function applyCropTransform() {
      cropImgEl.src    = cropNativeImg.src;
      cropImgEl.style.width  = (cropNativeImg.width  * cropScale) + 'px';
      cropImgEl.style.height = (cropNativeImg.height * cropScale) + 'px';
      cropImgEl.style.left   = cropOX + 'px';
      cropImgEl.style.top    = cropOY + 'px';
    }

    // Drag inside crop frame
    let cropDragging = false, cropDragStart = null;
    cropFrame.addEventListener('pointerdown', e => {
      cropDragging = true;
      cropDragStart = { x: e.clientX - cropOX, y: e.clientY - cropOY };
      cropFrame.setPointerCapture(e.pointerId);
    });
    cropFrame.addEventListener('pointermove', e => {
      if (!cropDragging) return;
      cropOX = e.clientX - cropDragStart.x;
      cropOY = e.clientY - cropDragStart.y;
      applyCropTransform();
    });
    cropFrame.addEventListener('pointerup', () => cropDragging = false);

    // Zoom via scroll wheel
    cropFrame.addEventListener('wheel', e => {
      e.preventDefault();
      const factor = e.deltaY > 0 ? 0.92 : 1.09;
      const newScale = Math.max(+cropZoom.min, Math.min(10, cropScale * factor));
      // Zoom toward center of frame
      const cx = CROP_SIZE / 2, cy = CROP_SIZE / 2;
      cropOX = cx - (cx - cropOX) * (newScale / cropScale);
      cropOY = cy - (cy - cropOY) * (newScale / cropScale);
      cropScale = newScale;
      cropZoom.value = cropScale;
      applyCropTransform();
    }, { passive: false });

    // Zoom slider
    cropZoom.addEventListener('input', () => {
      const newScale = +cropZoom.value;
      const cx = CROP_SIZE / 2, cy = CROP_SIZE / 2;
      cropOX = cx - (cx - cropOX) * (newScale / cropScale);
      cropOY = cy - (cy - cropOY) * (newScale / cropScale);
      cropScale = newScale;
      applyCropTransform();
    });

    document.getElementById('crop-ok').addEventListener('click', () => {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 200;
      const ctx = canvas.getContext('2d');
      // Source rect in original image pixels
      const srcX    = -cropOX / cropScale;
      const srcY    = -cropOY / cropScale;
      const srcSize = CROP_SIZE / cropScale;
      ctx.drawImage(cropNativeImg, srcX, srcY, srcSize, srcSize, 0, 0, 200, 200);
      const url = canvas.toDataURL('image/png');
      const sonotaList = document.getElementById('char-list-sonota');
      const newThumb = makeCharThumb(url, cropPendingName);
      const thumbSpan = newThumb.querySelector('span'); if (thumbSpan) thumbSpan.style.display = 'none';
      sonotaList.insertBefore(newThumb, document.getElementById('upload-thumb'));
      cropModal.classList.remove('open');
    });

    document.getElementById('crop-cancel').addEventListener('click', () => cropModal.classList.remove('open'));

    document.getElementById('file-input').addEventListener('change', e => {
      const file = e.target.files[0]; if (!file) return;
      e.target.value = '';
      const reader = new FileReader();
      reader.onload = ev => openCropModal(ev.target.result, file.name.replace(/\.[^.]+$/, ''));
      reader.readAsDataURL(file);
    });

  </script>

  <!-- ===== TUTORIAL JS ===== -->
  <script>
  (function () {
    const STORAGE_KEY = 'soukanzu_tutorial_seen';
    const MSGS = [
      'キャラを長押しして\n下のエリアに\n置いてみよう！',
      'もう1人\n置いてみよう！',
      '画像を長押しして\n別のキャラに\n線を伸ばそう！',
      '線の種類を変えてみよう！\n「カクカク」を\n選んでみて！',
      '矢印をタップして\n編集メニューを\n開いてみよう！',
    ];
    const TOTAL = MSGS.length;
    let step = 0;

    const bubble  = document.getElementById('tutorial-bubble');
    const toast   = document.getElementById('tutorial-toast');
    const openBtn = document.getElementById('tutorial-open-btn');
    if (!bubble) return;

    // --- ターゲット要素を返す ---
    function getTarget() {
      if (step === 1) return document.getElementById('top-controls');
      if (step === 2 || step === 3) {
        const el = document.querySelector('#canvas-area .placed-item');
        return el;
      }
      if (step === 4) return document.querySelector('.options-bar');
      if (step === 5) {
        return document.querySelector('#arrow-svg .arrow-group')
          || document.querySelector('#canvas-area .placed-item');
      }
      return null;
    }

    // --- 吹き出し位置を更新 ---
    function updatePos() {
      if (step < 1 || step > TOTAL) return;
      const target = getTarget();
      if (!target) return;
      const tr = target.getBoundingClientRect();
      const bw = bubble.offsetWidth  || 190;
      const bh = bubble.offsetHeight || 115;
      const TAIL = 12, MARGIN = 8;
      let top, cls;
      if (tr.top > bh + TAIL + MARGIN * 2) {
        top = tr.top - bh - TAIL;
        cls = 'tail-bottom';
      } else {
        top = tr.bottom + TAIL;
        cls = 'tail-top';
      }
      let left = tr.left + tr.width / 2 - bw / 2;
      left = Math.max(MARGIN, Math.min(left, window.innerWidth  - bw - MARGIN));
      top  = Math.max(MARGIN, Math.min(top,  window.innerHeight - bh - MARGIN));
      bubble.style.left = left + 'px';
      bubble.style.top  = top  + 'px';
      bubble.className  = cls;
    }

    // --- ステップを表示 ---
    function showStep(n) {
      step = n;
      if (n < 1 || n > TOTAL) { bubble.style.display = 'none'; return; }
      bubble.querySelector('.tb-step').textContent = `${n} / ${TOTAL}`;
      bubble.querySelector('.tb-msg').textContent  = MSGS[n - 1];
      bubble.style.display = 'block';
      requestAnimationFrame(() => requestAnimationFrame(updatePos)); // 2フレーム待って寸法確定
    }

    // --- ステップを進める ---
    function advance(reqStep) {
      if (step !== reqStep) return;
      if (step === TOTAL) {
        step = 0;
        bubble.style.display = 'none';
        localStorage.setItem(STORAGE_KEY, '1');
        if (toast) {
          toast.style.display = 'block';
          // アニメーション終了後に非表示
          setTimeout(() => { toast.style.display = 'none'; }, 2500);
        }
      } else {
        showStep(step + 1);
      }
    }

    // --- フック (メインコードから呼ばれる) ---
    window._tHook = function (event, data) {
      if      (event === 'placed'     && data === 1) advance(1);
      else if (event === 'placed'     && data >= 2)  advance(2);
      else if (event === 'arrow'      && data >= 1)  advance(3);
      else if (event === 'arrowPopup')               advance(5);
    };

    // --- 直線/カクカク切替で step4 完了 ---
    document.querySelectorAll('input[name="linetype"]').forEach(r => {
      r.addEventListener('change', () => { if (r.value === 'elbow') advance(4); });
    });

    // --- スキップ ---
    bubble.querySelector('.tb-skip').addEventListener('click', () => {
      step = 0;
      bubble.style.display = 'none';
      localStorage.setItem(STORAGE_KEY, '1');
    });

    // --- 「？」ボタンで再スタート ---
    openBtn?.addEventListener('click', () => {
      localStorage.removeItem(STORAGE_KEY);
      showStep(1);
    });

    // --- canvas スクロール / リサイズで位置追従 ---
    document.getElementById('canvas-wrap')?.addEventListener('scroll', updatePos, { passive: true });
    window.addEventListener('resize', updatePos);

    // --- 初回訪問のみ自動表示 ---
    if (!localStorage.getItem(STORAGE_KEY)) showStep(1);
  })();
  </script>

  <div id="tutorial-bubble">
