<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>原神・スタレの相関図メーカー - うーこの部屋</title>

  <link rel="icon" href="https://cdn.jsdelivr.net/gh/uko05/99_SharedImage@main/00_common/favicon_io/favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="https://cdn.jsdelivr.net/gh/uko05/99_SharedImage@main/00_common/favicon_io/apple-touch-icon.png">

  <style>
    /* ① ローカルフォント */
    @font-face {
      font-family: 'MihoyoZenZero';
      src: url('font/mihoyo-zenzero.ttf') format('truetype');
    }

    :root {
      --bg:      #f4f4f9;
      --surface: #ffffff;
      --surface2:#eeeeee;
      --accent:  #ffcc00;
      --text:    #333333;
      --muted:   #888888;
      --border:  #dddddd;
      --font:    'MihoyoZenZero','Hiragino Kaku Gothic ProN','Meiryo',sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== Header ===== */
    header {
      background: var(--surface);
      border-bottom: 2px solid var(--accent);
      position: sticky;
      top: 0;
      z-index: 200;
    }
    .header-top {
      min-height: 56px;
      padding: 8px 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .header-top h1 { font-size: 1rem; font-weight: bold; color: var(--text); letter-spacing: .05em; }
    .lang-switch {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      display: flex; gap: 8px; font-size: .8rem;
    }
    .lang-switch label { display: flex; align-items: center; gap: 3px; cursor: pointer; white-space: nowrap; }

    /* ===== Game tabs (equal width) ===== */
    .game-tab-bar { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); }
    .game-tab-btn {
      flex: 1; background: none; border: none; border-bottom: 3px solid transparent;
      padding: 10px 6px; font-family: var(--font); font-size: .85rem; color: var(--muted);
      cursor: pointer; transition: color .15s, border-color .15s; text-align: center; margin-bottom: -1px;
    }
    .game-tab-btn:hover { color: var(--text); }
    .game-tab-btn.active {
      color: var(--text); border-bottom-color: var(--accent); font-weight: bold;
      background: rgba(255,204,0,.1);
    }

    /* ===== Element tabs (equal width) ===== */
    .elem-tab-bar { display: flex; background: var(--surface2); border-bottom: 1px solid var(--border); }
    .elem-tab-btn {
      flex: 1; background: none; border: none; border-bottom: 3px solid transparent;
      padding: 5px 4px; font-family: var(--font); font-size: .72rem; color: var(--muted);
      cursor: pointer; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 2px; transition: background .15s, color .15s;
    }
    .elem-tab-btn img { width: 24px; height: 24px; object-fit: contain; pointer-events: none; }
    .elem-tab-btn.active { background: var(--surface); color: var(--text); font-weight: bold; border-bottom-color: var(--accent); }

    /* ===== Char list (horizontal reel) ===== */
    .char-list {
      display: flex; flex-wrap: nowrap; gap: 5px; padding: 8px;
      background: var(--surface); overflow-x: auto; overflow-y: hidden;
      border-bottom: 1px solid var(--border);
      scrollbar-width: none; cursor: grab; align-items: center;
      -webkit-overflow-scrolling: touch;
    }
    .char-list::-webkit-scrollbar { display: none; }
    .char-list.reel-grabbing { cursor: grabbing; }
    .reel-divider {
      flex-shrink: 0; width: 5px; height: 80px;
      align-self: center; margin: 0 8px;
      background: var(--accent); border-radius: 3px; opacity: .7;
    }
    .char-thumb {
      width: 94px; display: flex; flex-direction: column; align-items: center; gap: 2px;
      cursor: grab; border-radius: 6px; border: 2px solid transparent; padding: 2px;
      transition: border-color .15s; user-select: none; touch-action: none;
    }
    .char-thumb:hover { border-color: rgba(255,204,0,.6); }
    .char-thumb.dragging-active { border-color: var(--accent); opacity: .5; }
    .char-thumb img {
      width: 90px; height: 90px; object-fit: cover; border-radius: 4px;
      pointer-events: none; background: var(--surface2); display: block;
    }
    .char-thumb span {
      font-size: .5rem; color: var(--muted); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; max-width: 60px; text-align: center; pointer-events: none;
    }
    .upload-thumb {
      width: 62px; min-height: 76px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 3px; cursor: pointer;
      border-radius: 6px; border: 2px dashed var(--border); padding: 4px;
      font-size: .65rem; color: var(--muted); transition: border-color .15s, color .15s;
    }
    .upload-thumb:hover { border-color: var(--accent); color: var(--text); }
    .upload-thumb .plus { font-size: 1.4rem; line-height: 1; }
    #char-list-sonota { justify-content: center; }

    /* ===== Options bar ===== */
    .options-bar {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 7px 12px; display: flex; align-items: center; flex-shrink: 0; flex-wrap: wrap;
    }
    .opts-left  { display: flex; align-items: center; gap: 12px; flex: 1; }
    .opts-right { display: flex; align-items: center; gap: 8px; flex: 1; justify-content: flex-end; }
    .opts-right .sns-link img { width: 28px; height: 28px; border-radius: 6px; display: block; transition: opacity .15s; }
    .opts-right .sns-link:hover img { opacity: .75; }
    .options-bar label { display: flex; align-items: center; gap: 4px; font-size: .82rem; cursor: pointer; }
    #save-btn {
      background: var(--accent); border: none; border-radius: 6px;
      padding: 6px 14px; font-family: var(--font); font-size: .85rem; font-weight: bold;
      cursor: pointer; color: var(--text); transition: opacity .15s; flex-shrink: 0;
    }
    #save-btn:hover { opacity: .8; }
    #group-mode-btn {
      background: none; border: 1px solid var(--border); border-radius: 6px;
      padding: 5px 10px; font-family: var(--font); font-size: .8rem; cursor: pointer;
      color: var(--muted); transition: background .15s, color .15s, border-color .15s;
    }
    #group-mode-btn.active {
      background: rgba(255,204,0,.2); border-color: var(--accent); color: var(--text); font-weight: bold;
    }

    /* ===== Canvas wrap ===== */
    #canvas-wrap { flex: 1; overflow: auto; background: var(--bg); padding: 0; min-height: 0; }
    #canvas-area {
      position: relative; width: 100%; min-height: 800px;
      background: var(--surface); border: none; overflow: visible;
      --grid-color: #e8e8ee;
      background-image: linear-gradient(var(--grid-color) 1px, transparent 1px),
                        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    #canvas-area.drag-over { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,204,0,.25); }
    #canvas-area.group-draw-mode { cursor: crosshair; }

    /* Arrow SVG on top of everything */
    #arrow-svg {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; overflow: visible; z-index: 15;
    }

    /* ===== Group boxes ===== */
    .group-box {
      position: absolute; border: 2px solid; border-radius: 0 8px 8px 8px;
      z-index: 3; pointer-events: all; cursor: default;
    }
    .group-label {
      position: absolute; top: -26px; left: -2px; z-index: 1;
      padding: 3px 10px; font-size: .76rem; font-weight: bold; border-radius: 5px 5px 0 0;
      cursor: grab; pointer-events: all; user-select: none; white-space: nowrap;
      color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.4);
      font-family: var(--font);
    }
    .group-label:active { cursor: grabbing; }
    /* Group edit modes */
    .group-box.group-move-mode   { cursor: move !important; outline: 2px dashed var(--accent); outline-offset: 3px; }
    .group-box.group-resize-mode { outline: 2px dashed var(--accent); outline-offset: 3px; }
    .group-edit-done {
      position: absolute; top: -28px; right: -2px; z-index: 100; pointer-events: all;
      background: var(--accent); color: var(--text); border: none; border-radius: 4px;
      padding: 2px 10px; font-size: .72rem; font-weight: bold; cursor: pointer;
      font-family: var(--font); white-space: nowrap;
    }
    .resize-handle {
      position: absolute; width: 12px; height: 12px;
      background: #fff; border: 2px solid var(--accent); border-radius: 2px;
      z-index: 50; pointer-events: all; touch-action: none; box-sizing: border-box;
    }
    .rh-nw { top: -6px;  left: -6px;              cursor: nw-resize; }
    .rh-n  { top: -6px;  left: calc(50% - 6px);   cursor: n-resize;  }
    .rh-ne { top: -6px;  right: -6px;              cursor: ne-resize; }
    .rh-e  { top: calc(50% - 6px); right: -6px;   cursor: e-resize;  }
    .rh-se { bottom: -6px; right: -6px;            cursor: se-resize; }
    .rh-s  { bottom: -6px; left: calc(50% - 6px); cursor: s-resize;  }
    .rh-sw { bottom: -6px; left: -6px;             cursor: sw-resize; }
    .rh-w  { top: calc(50% - 6px); left: -6px;    cursor: w-resize;  }
    /* Drawing preview */
    .group-preview {
      position: absolute; border: 2px dashed var(--accent); border-radius: 4px;
      background: rgba(255,204,0,.08); pointer-events: none; z-index: 4;
    }

    /* ===== Placed items ===== */
    .placed-item {
      position: absolute; display: flex; flex-direction: column; align-items: center; gap: 2px;
      cursor: pointer; user-select: none; z-index: 10; touch-action: none;
    }
    .placed-item img {
      object-fit: cover; border-radius: 6px; border: 2px solid var(--border);
      background: var(--surface2); pointer-events: none; display: block;
    }
    .placed-item.connecting-source img { border-color: #e05a2b; box-shadow: 0 0 8px rgba(224,90,43,.5); }
    /* Junction node */
    .junction-node {
      width: 16px; height: 16px; border-radius: 50%;
      background: #555; border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.35);
    }
    .placed-text {
      font-size: .62rem; color: var(--text); text-align: center; word-break: break-all;
      min-height: 14px; background: rgba(255,255,255,.9); border-radius: 3px;
      padding: 1px 3px; pointer-events: none; line-height: 1.3; max-width: 200px;
    }

    /* ===== Popup ===== */
    #popup-menu {
      position: fixed; z-index: 1000; background: var(--surface);
      border: 1px solid var(--border); border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,.2); padding: 5px;
      display: none; flex-direction: column; gap: 3px; min-width: 130px;
    }
    .popup-btn {
      background: none; border: 1px solid var(--border); border-radius: 5px;
      padding: 7px 10px; font-family: var(--font); font-size: .82rem;
      cursor: pointer; text-align: left; transition: background .1s; width: 100%;
    }
    .popup-btn:hover { background: var(--surface2); }
    .popup-btn.danger { color: #dc3545; }
    .popup-resize-row { display: flex; gap: 3px; }
    .popup-resize-row .popup-btn { flex: 1; text-align: center; }
    /* Color swatches */
    #popup-color-row { padding: 3px 0 2px; }
    #popup-color-row .row-label { font-size: .68rem; color: var(--muted); margin-bottom: 4px; }
    .color-swatches { display: flex; gap: 4px; flex-wrap: wrap; max-width: 178px; }
    .color-swatch {
      width: 22px; height: 22px; border-radius: 4px;
      border: 3px solid; cursor: pointer; transition: transform .1s; flex-shrink: 0;
    }
    .color-swatch:hover { transform: scale(1.15); }
    .color-swatch.active { outline: 2px solid var(--text); outline-offset: 2px; }

    /* ===== Crop modal ===== */
    #crop-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,.78);
      display: none; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; z-index: 3000;
    }
    #crop-modal.open { display: flex; }
    .crop-title { color: #fff; font-family: var(--font); font-size: .9rem; }
    .crop-frame {
      width: 280px; height: 280px; overflow: hidden; position: relative;
      border: 3px solid var(--accent); border-radius: 6px; background: #111;
      cursor: grab; touch-action: none;
    }
    .crop-frame:active { cursor: grabbing; }
    .crop-frame img { position: absolute; transform-origin: 0 0; pointer-events: none; user-select: none; }
    .crop-zoom-row { display: flex; align-items: center; gap: 10px; }
    .crop-zoom-row label { color: #ccc; font-family: var(--font); font-size: .78rem; }
    #crop-zoom { width: 160px; }
    .crop-actions { display: flex; gap: 10px; }
    .crop-actions button {
      font-family: var(--font); font-size: .85rem; padding: 8px 20px;
      border-radius: 6px; border: none; cursor: pointer;
    }
    #crop-ok     { background: var(--accent); font-weight: bold; }
    #crop-cancel { background: #555; color: #fff; }

    /* ===== Drag ghost ===== */
    #drag-ghost {
      position: fixed; pointer-events: none; z-index: 9999;
      display: none; transform: translate(-28px,-28px);
    }
    #drag-ghost img {
      width: 56px; height: 56px; object-fit: cover;
      border-radius: 6px; border: 2px solid var(--accent); opacity: .85; display: block;
    }

    /* ===== Text edit popup ===== */
    #text-edit-popup {
      position: fixed; z-index: 1001; background: var(--surface);
      border: 1px solid var(--border); border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,.2); padding: 12px;
      display: none; flex-direction: column; gap: 8px; min-width: 230px;
    }
    .text-edit-label { font-size: .78rem; color: var(--muted); }
    #text-edit-input {
      font-family: var(--font); font-size: .9rem;
      border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; outline: none; width: 100%;
    }
    #text-edit-input:focus { border-color: var(--accent); }
    .text-edit-actions { display: flex; gap: 6px; justify-content: flex-end; }
    .text-edit-actions button {
      background: none; border: 1px solid var(--border); border-radius: 4px;
      padding: 5px 12px; font-family: var(--font); font-size: .82rem; cursor: pointer;
    }
    .text-edit-actions button.ok { background: var(--accent); border-color: var(--accent); font-weight: bold; }

    /* ===== Mobile: fixed top controls ===== */
    @media (max-width: 768px) {
      body { height: 100dvh; overflow: hidden; }
      #top-controls {
        flex-shrink: 0; overflow-y: auto; max-height: 60dvh;
        scrollbar-width: none;
      }
      #top-controls::-webkit-scrollbar { display: none; }
      #canvas-wrap { flex: 1; min-height: 0; overflow: auto; }
      /* ヘッダー: 重なり修正 */
      .header-top { padding: 6px 10px; justify-content: space-between; }
      .header-top h1 { font-size: .72rem; flex: 1; text-align: center; }
      #tutorial-open-btn { position: static; transform: none; flex-shrink: 0; }
      .lang-switch { position: static; transform: none; flex-shrink: 0; gap: 6px; }
      /* canvas hint */
      #canvas-hint {
        top: 72px; left: 50%; transform: translateX(-50%);
        text-align: center; font-size: .82rem; line-height: 2.1;
        white-space: normal; width: 88%;
      }
      #canvas-hint .ch-title { font-size: .95rem; }
      /* chart title input */
      #chart-title-input { min-width: 160px; font-size: .8rem; padding: 4px 10px; }
      /* Options bar: 2行に */
      .options-bar { flex-wrap: wrap; padding: 5px 8px; gap: 5px; }
      .opts-left { flex: 1 1 100%; justify-content: center; gap: 10px; }
      #save-btn { flex: 1; }
      .opts-right { flex-shrink: 0; }
    }

    /* ===== Canvas hint & chart title ===== */
    #canvas-hint {
      position: absolute; top: 60px; left: 20px;
      color: rgba(100,100,100,0.32); font-size: 1.25rem; text-align: left;
      line-height: 2.6; pointer-events: none; user-select: none; white-space: nowrap;
    }
    #canvas-hint .ch-title { font-size: 1.5rem; font-weight: bold; margin-bottom: 6px; }
    #chart-title-wrap {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      z-index: 5; pointer-events: all;
    }
    #chart-title-input {
      background: rgba(255,255,255,0.88); border: 1.5px solid var(--border);
      border-radius: 8px; padding: 5px 16px; font-family: var(--font);
      font-size: .9rem; color: var(--text); text-align: center;
      min-width: 220px; outline: none; transition: border-color .15s, box-shadow .15s;
    }
    #chart-title-input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(255,204,0,.25); }
    #chart-title-input::placeholder { color: var(--muted); }

    /* ===== TUTORIAL CSS (削除する場合: この CSS ブロック + HTML 2箇所 + JS ブロック + TUTORIAL HOOK 3行) ===== */
    #tutorial-open-btn {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: 1.5px solid var(--border); border-radius: 50%;
      width: 30px; height: 30px; font-size: .9rem; cursor: pointer;
      color: var(--muted); display: flex; align-items: center; justify-content: center;
      transition: border-color .15s, color .15s; z-index: 10;
    }
    #tutorial-open-btn:hover { border-color: var(--accent); color: var(--text); }
    #tutorial-bubble {
      position: fixed; z-index: 8500; display: none;
      background: var(--accent); color: var(--text);
      border-radius: 14px; padding: 14px 16px 10px;
      max-width: 195px; min-width: 155px;
      box-shadow: 0 4px 18px rgba(0,0,0,.3);
      font-size: .82rem; line-height: 1.55; text-align: center;
      pointer-events: all;
      animation: tPulse 2s ease-in-out infinite;
    }
    @keyframes tPulse {
      0%,100% { box-shadow: 0 4px 18px rgba(0,0,0,.3), 0 0 0 0   rgba(255,204,0,.65); }
      50%      { box-shadow: 0 4px 18px rgba(0,0,0,.3), 0 0 0 12px rgba(255,204,0,0);  }
    }
    #tutorial-bubble::after {
      content: ''; position: absolute;
      width: 0; height: 0; border: 10px solid transparent;
    }
    #tutorial-bubble.tail-bottom::after {
      top: 100%; left: 50%; transform: translateX(-50%);
      border-top-color: var(--accent);
    }
    #tutorial-bubble.tail-top::after {
      bottom: 100%; left: 50%; transform: translateX(-50%);
      border-bottom-color: var(--accent);
    }
    .tb-step { font-size: .7rem; opacity: .65; margin-bottom: 5px; }
    .tb-msg  { white-space: pre-line; font-weight: bold; }
    .tb-skip {
      margin-top: 10px; background: rgba(0,0,0,.15); border: none;
      border-radius: 6px; padding: 4px 14px; font-family: var(--font);
      font-size: .72rem; cursor: pointer; color: var(--text); display: block; width: 100%;
      transition: background .15s;
    }
    .tb-skip:hover { background: rgba(0,0,0,.28); }
    #tutorial-toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
      background: var(--accent); color: var(--text); border-radius: 12px;
      padding: 13px 28px; font-weight: bold; font-size: .9rem;
      box-shadow: 0 4px 18px rgba(0,0,0,.3); z-index: 8600; display: none;
      animation: tFade 2.5s ease forwards;
    }
    @keyframes tFade {
      0%   { opacity: 0; transform: translateX(-50%) translateY(8px); }
      12%  { opacity: 1; transform: translateX(-50%) translateY(0);   }
      80%  { opacity: 1; }
      100% { opacity: 0; }
    }
    /* ===== TUTORIAL CSS END ===== */

  </style>
</head>
<body>

  <div id="top-controls">
  <header id="main-header">
    <div class="header-top">
      <!-- TUTORIAL OPEN BTN -->
      <button id="tutorial-open-btn" title="使い方ガイド">？</button>
      <h1 id="site-title">原神・スタレの相関図メーカー</h1>
      <div class="lang-switch">
        <label><input type="radio" name="lang" value="ja" checked> 日本語</label>
        <label><input type="radio" name="lang" value="en"> English</label>
      </div>
    </div>
  </header>

  <!-- Game tabs -->
  <div class="game-tab-bar">
    <button class="game-tab-btn active" data-game="genshin"   data-i18n-key="genshinTab">原神</button>
    <button class="game-tab-btn"        data-game="starrail"  data-i18n-key="starrailTab">崩壊：スターレイル</button>
    <button class="game-tab-btn"        data-game="sonota"    data-i18n-key="sonotaTab">その他</button>
  </div>

  <!-- Genshin -->
  <div id="game-genshin" class="game-section">
    <div class="elem-tab-bar" id="genshin-elem-tabs">
      <button class="elem-tab-btn active" data-elem="hi">
        <img src="https://cdn.jsdelivr.net/gh/uko05/99_SharedImage@main/01_Genshin/Genso/hi.png" alt="">
        <span data-i18n-key="hi">炎</span>
      </button>
      <button class="elem-tab-btn" data-elem="mizu">
        <img src="https://cdn.jsdelivr.net/gh/uko05/99_SharedImage@main/01_Genshin/Genso/mizu.png" alt="">
        <span data-i18n-key="mizu">水</span>
      </button>
      <button class="elem-tab-btn" data-elem="koori">
        <img src="https://cdn.jsdelivr.net/gh/uko05/99_SharedImage@main/01_Genshin/Genso/koori.png" alt="">
        <span data-i18n-key="koori">氷</span>
      </button>
      <button class="elem-tab-btn" data-elem="kaminari">
        <img src="https://cdn.jsdelivr.net/gh/uko05/99_SharedImage@main/01_Genshin/Genso/kaminari.png" alt="">
        <span data-i18n-key="kaminari">雷</span>
      </button>
      <button class="elem-tab-btn" data-elem="kusa">

  <script type="module">
    import { genshinChars }  from 'https://cdn.jsdelivr.net/gh/uko05/99_SharedImage@main/01_Genshin/chara_data/genshin_chars.js';

    const STARRAIL_BASE = 'https://cdn.jsdelivr.net/gh/uko05/99_SharedImage@main/02_Starrail/chara_full/';

    // ===== i18n =====
    const i18n = {
      ja: {
        title:'原神・スタレの相関図メーカー', genshinTab:'原神', starrailTab:'崩壊：スターレイル',
        sonotaTab:'その他', straight:'直線', elbow:'カクカク', saveImage:'Save Image',
        anyImage:'任意', groupMode:'□ グループ',
        hi:'炎', mizu:'水', koori:'氷', kaminari:'雷', kusa:'草', kaze:'風', iwa:'岩',
        kyosuu:'虚数', ryoushi:'量子', butsuri:'物理',
        inputBtn:'✏ 入力', deleteBtn:'🗑 削除', bidirBtn:'⇄ 逆矢印を追加',
        enlargeBtn:'拡大＋', shrinkBtn:'縮小−', textEditLabel:'テキストを入力',
        arrowOnToOff:'矢印あり→なし', arrowOffToOn:'矢印なし→あり',
        arrowReverse:'矢印逆転', midpointAdd:'中継点を追加',
        bends1to2:'折れ：1→2', bends2to1:'折れ：2→1',
        straightToElbow:'直線→カクカク', elbowToStraight:'カクカク→直線',
      },
      en: {
        title:'Genshin/StarRail Relation Chart', genshinTab:'Genshin', starrailTab:'Honkai: Star Rail',
        sonotaTab:'Other', straight:'Straight', elbow:'Elbow', saveImage:'Save Image',
        anyImage:'Custom', groupMode:'□ Group',
        hi:'Fire', mizu:'Hydro', koori:'Ice', kaminari:'Lightning', kusa:'Dendro', kaze:'Wind', iwa:'Geo',
        kyosuu:'Imaginary', ryoushi:'Quantum', butsuri:'Physical',
        inputBtn:'✏ Label', deleteBtn:'🗑 Delete', bidirBtn:'⇄ Add Reverse Arrow',
        enlargeBtn:'Enlarge＋', shrinkBtn:'Shrink−', textEditLabel:'Enter text',
        arrowOnToOff:'Arrow→No Arrow', arrowOffToOn:'No Arrow→Arrow',
        arrowReverse:'Reverse Arrow', midpointAdd:'Add Junction',
        bends1to2:'Bends：1→2', bends2to1:'Bends：2→1',
        straightToElbow:'Straight→Elbow', elbowToStraight:'Elbow→Straight',
      },
    };

    let currentLang = localStorage.getItem('lang') || 'ja';

    function applyLang(lang) {
      currentLang = lang;
      localStorage.setItem('lang', lang);
      const d = i18n[lang] || i18n.ja;
      document.getElementById('site-title').textContent = d.title;
      document.querySelectorAll('[data-i18n-key]').forEach(el => {
        const k = el.dataset.i18nKey;
        if (d[k] != null) el.textContent = d[k];
      });
      document.getElementById('popup-input-btn').textContent  = d.inputBtn;
      document.getElementById('popup-delete-btn').textContent = d.deleteBtn;
      document.getElementById('popup-bidir-btn').textContent  = d.bidirBtn;
      document.getElementById('popup-enlarge-btn').textContent = d.enlargeBtn;
      document.getElementById('popup-shrink-btn').textContent  = d.shrinkBtn;
      document.getElementById('text-edit-label').textContent  = d.textEditLabel;
    }

    document.querySelectorAll('input[name="lang"]').forEach(r => {
      if (r.value === currentLang) r.checked = true;
      r.addEventListener('change', e => applyLang(e.target.value));
    });
    applyLang(currentLang);

    // ===== State =====
    let placedItems = [];  // { id, src, name, x, y, text, scale }
    let arrows      = [];  // { id, fromId, toId, text }
    let groups      = [];  // { id, x, y, w, h, label, colorIdx }
    let nextItemId  = 1, nextArrowId = 1, nextGroupId = 1;

    const LONG_PRESS_MS  = 240;
    const DRAG_THRESHOLD = 8;
    const BASE_IMG       = 72; // px at scale 1.0

let iState          = 'idle';
    let pressTimer      = null;
    let pressStart      = null;
    let draggingId      = null;
    let connectSrcId       = null;
    let connectSrcSide     = null;   // which side of source the arrow exits from
    let connectSrcArrowId  = null;   // when branching from midpoint: source arrow ID
    let connectSrcArrowPt  = null;   // {x,y} start point of rubber band for arrow-anchor mode
    let hoveredSideDot     = null;   // { itemId, side, x, y }
    let sideDotEls         = [];     // SVG circles shown during connecting mode
    let tabPlacing      = null;
    let groupMode       = false;

    const canvasArea     = document.getElementById('canvas-area');
    const canvasWrap     = document.getElementById('canvas-wrap');
    const arrowSvg       = document.getElementById('arrow-svg');
    const popupMenu           = document.getElementById('popup-menu');
    const popupInputBtn       = document.getElementById('popup-input-btn');
    const popupDeleteBtn      = document.getElementById('popup-delete-btn');
    const popupBidirBtn       = document.getElementById('popup-bidir-btn');
    const popupResizeRow      = document.getElementById('popup-resize-row');
    const popupColorRow       = document.getElementById('popup-color-row');
    const popupArrowToggleBtn  = document.getElementById('popup-arrow-toggle-btn');
    const popupArrowReverseBtn = document.getElementById('popup-arrow-reverse-btn');
    const popupLinetypeBtn     = document.getElementById('popup-linetype-btn');
    const popupElbowBendsBtn   = document.getElementById('popup-elbow-bends-btn');
    const popupGroupMoveBtn    = document.getElementById('popup-group-move-btn');
    const popupGroupResizeBtn  = document.getElementById('popup-group-resize-btn');
    const popupGroupBorderBtn  = document.getElementById('popup-group-border-btn');
    const popupGroupLabelBtn   = document.getElementById('popup-group-label-btn');

    let groupEditId   = null; // グループ編集モード中のグループID
    let groupEditMode = null; // 'move' | 'resize'
    const textEditPopup  = document.getElementById('text-edit-popup');
    const textEditInput  = document.getElementById('text-edit-input');
    const textEditOk     = document.getElementById('text-edit-ok');
    const textEditCancel = document.getElementById('text-edit-cancel');
    const dragGhost      = document.getElementById('drag-ghost');
    const dragGhostImg   = document.getElementById('drag-ghost-img');

    let popupTarget    = null;
    let textEditTarget = null;
    let textEditIsNewGroup = false;

    // ===== ④ Group colors =====
    const GROUP_COLORS = [
      { border: '#b8960c', bg: '#fffde8' }, // 黄
      { border: '#cccccc', bg: '#ffffff' }, // 白
      { border: '#2266cc', bg: '#e8f0fe' }, // 青
      { border: '#44aaee', bg: '#e0f4ff' }, // 水色
      { border: '#228833', bg: '#e8f5e9' }, // 緑
      { border: '#55bb44', bg: '#f0fbe8' }, // 薄緑
      { border: '#cc3322', bg: '#fde8e8' }, // 赤
      { border: '#ee6677', bg: '#fde8ef' }, // ピンク
      { border: '#8833bb', bg: '#f3e5f5' }, // 紫
      { border: '#cc55cc', bg: '#fce8fc' }, // 薄紫
      { border: '#cc6600', bg: '#fff3e0' }, // 橙
      { border: '#996633', bg: '#f5ede0' }, // 茶
      { border: '#666666', bg: '#f0f0f0' }, // 灰
      { border: '#333333', bg: '#e8e8e8' }, // 黒
    ];

    // Build color swatches in popup
    const swatchContainer = document.getElementById('color-swatches');
    GROUP_COLORS.forEach((c, idx) => {
      const btn = document.createElement('button');
      btn.className = 'color-swatch';
      btn.style.background   = c.bg;
      btn.style.borderColor  = c.border;
      btn.dataset.idx = idx;
      btn.addEventListener('click', () => {
        if (!popupTarget || popupTarget.type !== 'group') return;
        const grp = groups.find(g => g.id === popupTarget.id);
        if (!grp) return;
        grp.colorIdx = idx;
        applyGroupColor(grp);
        swatchContainer.querySelectorAll('.color-swatch').forEach((s, i) => s.classList.toggle('active', i === idx));
      });
      swatchContainer.appendChild(btn);
    });

    // ===== Language =====
    document.querySelectorAll('.game-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.game-tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.querySelectorAll('.game-section').forEach(s => s.style.display = 'none');
        document.getElementById(`game-${btn.dataset.game}`).style.display = '';
      });
    });

    function setupElemTabs(tabBarId, charListId, isGenshin) {
      document.getElementById(tabBarId).querySelectorAll('.elem-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.getElementById(tabBarId).querySelectorAll('.elem-tab-btn')
            .forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          if (isGenshin) {
            renderCharList(charListId, genshinChars.filter(c => c.element === btn.dataset.elem), GENSHIN_BASE, true, btn.dataset.elem);
          } else {
            renderCharList(charListId, starrailChars.filter(c => c.element === btn.dataset.elem), STARRAIL_BASE, false, btn.dataset.elem);
          }
        });
      });
    }
    setupElemTabs('genshin-elem-tabs',  'char-list-genshin',  true);
    setupElemTabs('starrail-elem-tabs', 'char-list-starrail', false);

    const REEL_COPIES = 3;
    const ELEM_COLOR = {
      hi:       '#e05a2b', mizu:    '#2b6be0', koori:   '#42a5c8',
      kaminari: '#9b59b6', kusa:    '#3a9b47', kaze:    '#2aaba8',
      iwa:      '#c8963e', butsuri: '#888888', kyosuu:  '#c8a800',
      ryoushi:  '#5b4fa0',
    };

    function renderCharList(listId, chars, baseUrl, hasName, elem) {
      const list = document.getElementById(listId);
      list.innerHTML = '';
      if (!chars.length) { list.innerHTML = '<span style="color:var(--muted);font-size:.8rem;padding:8px">キャラなし</span>'; return; }
      const divColor = ELEM_COLOR[elem] || 'var(--accent)';
      // Render REEL_COPIES copies for infinite loop illusion; divider before each copy
      for (let c = 0; c < REEL_COPIES; c++) {
        const div = document.createElement('div');
        div.className = 'reel-divider';
        div.style.background = divColor;
        list.appendChild(div);
        chars.forEach(ch => {
          const name = hasName ? (ch.name || ch.icon.replace(/\.\w+$/, '')) : ch.icon.replace(/\.\w+$/, '');
          list.appendChild(makeCharThumb(`${baseUrl}${ch.icon}`, name));
        });
      }
      // After layout, jump to middle copy so both directions have room
      requestAnimationFrame(() => {
        list._reelSingleW = list.scrollWidth / REEL_COPIES;
        list.scrollLeft   = list._reelSingleW;
      });
    }

    function setupReelBehavior(el) {
      // Wrap in relative container for arrow buttons
      const wrap = document.createElement('div');
      wrap.style.cssText = 'position:relative;';
      el.parentNode.insertBefore(wrap, el);
      wrap.appendChild(el);

      const getStep = () => {
        const thumb = el.querySelector('.char-thumb');
        return thumb ? thumb.offsetWidth + 5 : 99; // thumb width + gap
      };
      const mkBtn = (side, label) => {
        const b = document.createElement('button');
        b.textContent = label;
        b.style.cssText = `position:absolute;${side}:0;top:50%;transform:translateY(-50%);
          z-index:20;background:rgba(0,0,0,.42);color:#fff;border:none;
          width:45px;height:94px;cursor:pointer;font-size:1.2rem;line-height:1;
          border-radius:${side==='left'?'0 6px 6px 0':'6px 0 0 6px'};
          pointer-events:all;user-select:none;display:flex;align-items:center;justify-content:center;`;
        b.addEventListener('click', () => el.scrollBy({ left: side==='left' ? -getStep() : getStep(), behavior:'instant' }));
        wrap.appendChild(b);
      };
      mkBtn('left', '◀');
      mkBtn('right', '▶');

      el.addEventListener('wheel', e => {
        e.preventDefault();
        let delta = e.deltaY !== 0 ? e.deltaY : e.deltaX;
        if (e.deltaMode === 1) delta *= 40;
        if (e.deltaMode === 2) delta *= el.clientWidth;
        el.scrollLeft += delta;
      }, { passive: false });

      let reelDragging = false, reelStartX = 0, reelScrollStart = 0;
      el.addEventListener('pointerdown', e => {
        if (e.target.closest('.char-thumb') || e.target.closest('.upload-thumb')) return;
        reelDragging = true; reelStartX = e.clientX; reelScrollStart = el.scrollLeft;
        el.classList.add('reel-grabbing'); e.preventDefault();
      });
      document.addEventListener('pointermove', e => {
        if (!reelDragging) return;
        el.scrollLeft = reelScrollStart - (e.clientX - reelStartX);
      });
      document.addEventListener('pointerup', () => {
        reelDragging = false; el.classList.remove('reel-grabbing');
      });

      // Infinite loop: when near either edge, jump by one copy width
      el.addEventListener('scroll', () => {
        const sw = el._reelSingleW;
        if (!sw) return;
        if      (el.scrollLeft < sw * 0.3) el.scrollLeft += sw;
        else if (el.scrollLeft > sw * 1.7) el.scrollLeft -= sw;
      }, { passive: true });
    }

    renderCharList('char-list-genshin',  genshinChars.filter(c => c.element === 'hi'),  GENSHIN_BASE,  true,  'hi');
    renderCharList('char-list-starrail', starrailChars.filter(c => c.element === 'hi'), STARRAIL_BASE, false, 'hi');
    setupReelBehavior(document.getElementById('char-list-genshin'));
    setupReelBehavior(document.getElementById('char-list-starrail'));
    setupReelBehavior(document.getElementById('char-list-sonota'));

    // その他サムネ（静的HTML thumbs）
    document.querySelectorAll('#char-list-sonota .char-thumb').forEach(thumb => {
      thumb.addEventListener('pointerdown', e => {
        if (e.button === 2) return;
        startTabDrag(e, thumb.dataset.src, thumb.dataset.name, thumb);
      });
    });

    // ===== Char thumb =====
    function makeCharThumb(src, name) {
      const div = document.createElement('div');
      div.className = 'char-thumb';
      div.dataset.src = src; div.dataset.name = name;
      const img = document.createElement('img');
      img.src = src; img.alt = name; img.draggable = false;
      img.onerror = () => { img.style.opacity = '.3'; };
      div.appendChild(img);
      div.addEventListener('pointerdown', e => {
        if (e.button === 2) return;
        startTabDrag(e, src, name, div);
      });
      return div;
    }

    // ===== Drag from tab =====
    function startTabDrag(e, src, name, thumbEl) {
      if (iState !== 'idle') return;
      e.preventDefault();
      const sx = e.clientX, sy = e.clientY;
      let started = false;
      iState = 'placing-tab'; tabPlacing = { src, name };
      dragGhostImg.src = src;

      const onMove = ev => {
        ev.preventDefault();
        if (!started) {
          if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 5) return;
          started = true;
          dragGhost.style.display = 'block';
          thumbEl.classList.add('dragging-active');
        }
        moveGhost(ev.clientX, ev.clientY);
        canvasArea.classList.toggle('drag-over', isOverCanvas(ev.clientX, ev.clientY));
      };
      const onUp = ev => {
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onUp);
        dragGhost.style.display = 'none';
        canvasArea.classList.remove('drag-over');
        thumbEl.classList.remove('dragging-active');
        if (started && isOverCanvas(ev.clientX, ev.clientY) && tabPlacing) {
          const r = canvasArea.getBoundingClientRect();
          const x = ev.clientX - r.left + canvasWrap.scrollLeft - 40;
          const y = ev.clientY - r.top  + canvasWrap.scrollTop  - 40;
          placeItem(tabPlacing.src, tabPlacing.name, Math.max(4, x), Math.max(4, y));
        }
        iState = 'idle'; tabPlacing = null;
      };
      document.addEventListener('pointermove', onMove, { passive: false });
      document.addEventListener('pointerup', onUp);
    }

    function moveGhost(cx, cy) { dragGhost.style.left = cx + 'px'; dragGhost.style.top = cy + 'px'; }
    function isOverCanvas(cx, cy) {
      const r = canvasArea.getBoundingClientRect();
      return cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom;
    }

    // ===== Place item =====
    const JUNCTION_SZ = 16;
    function iSz(item) {
      if (item.type === 'junction') return JUNCTION_SZ;
      return Math.round(BASE_IMG * (item.scale || 1));
    }
    function dW(item) {
      if (item.type === 'junction') return JUNCTION_SZ;
      return iSz(item) + 8;
    }

    function placeItem(src, name, x, y) {
      const id = `item-${nextItemId++}`;
      const item = { id, src, name, x, y, text: '', scale: 1.25 };
      placedItems.push(item);
      canvasArea.appendChild(createItemEl(item));
      growCanvas(x + 120, y + 140);
      window._tHook?.('placed', placedItems.length); // TUTORIAL HOOK
    }

    function placeJunction(x, y) {
      const id = `item-${nextItemId++}`;
      const item = { id, src: null, name: '', x, y, text: '', scale: 1.0, type: 'junction' };
      placedItems.push(item);
      canvasArea.appendChild(createItemEl(item));
      return id;
    }

    function createItemEl(item) {
      const el = document.createElement('div');
      el.className = 'placed-item'; el.id = item.id;
      el.style.left = item.x + 'px'; el.style.top = item.y + 'px';

      if (item.type === 'junction') {
        el.style.width = JUNCTION_SZ + 'px'; el.style.height = JUNCTION_SZ + 'px';
        const dot = document.createElement('div');
        dot.className = 'junction-node';
        el.appendChild(dot);
        el.style.cursor = 'grab';
        el.addEventListener('click', e => e.stopPropagation());
        el.addEventListener('pointerdown', e => {
          if (e.button === 2) return;
          e.stopPropagation(); e.preventDefault();
          onItemDown(e, item.id);
        });
        return el;
      }

      const sz = iSz(item), w = dW(item);
      el.style.width = w + 'px';
      const img = document.createElement('img');
      img.src = item.src; img.alt = item.name; img.draggable = false;
      img.style.width = sz + 'px'; img.style.height = sz + 'px';
      img.onerror = () => { img.style.opacity = '.3'; };
      const txt = document.createElement('div');
      txt.className = 'placed-text'; txt.textContent = item.text; txt.style.maxWidth = w + 'px';
      el.appendChild(img); el.appendChild(txt);
      el.addEventListener('click', e => e.stopPropagation());
      el.addEventListener('contextmenu', e => {
        e.preventDefault(); e.stopPropagation();
        showItemPopup(item.id, e.clientX, e.clientY);
      });
      el.addEventListener('pointerdown', e => {
        if (e.button === 2) return;
        e.stopPropagation(); e.preventDefault();
        onItemDown(e, item.id);
      });
      return el;
    }

    function applyItemSize(itemId) {
      const item = placedItems.find(i => i.id === itemId);
      if (!item) return;
      const el = document.getElementById(itemId); if (!el) return;
      const sz = iSz(item), w = dW(item);
      el.style.width = w + 'px';
      const img = el.querySelector('img');
      if (img) { img.style.width = sz + 'px'; img.style.height = sz + 'px'; }
      const txt = el.querySelector('.placed-text');
      if (txt) txt.style.maxWidth = w + 'px';
      growCanvas(item.x + w + 20, item.y + sz + 40);
      redrawArrows();
    }

    // ===== Item interaction =====
    function onItemDown(e, itemId) {
      if (iState !== 'idle') return;
      closePopup();
      iState = 'pressing'; pressStart = { x: e.clientX, y: e.clientY, itemId };
      pressTimer = setTimeout(() => {
        if (iState !== 'pressing') return;
        iState = 'connecting'; connectSrcId = itemId;
        // Determine fromSide from press position relative to item center
        const cr = canvasArea.getBoundingClientRect();
        const px = pressStart.x - cr.left + canvasWrap.scrollLeft;
        const py = pressStart.y - cr.top  + canvasWrap.scrollTop;
        const ic = itemCenter(itemId);
        const srcItem = placedItems.find(i => i.id === itemId);
        if (ic && srcItem?.type !== 'junction') {
          const ddx = px - ic.x, ddy = py - ic.y;
          const hw = iSz(srcItem) / 2, hh = ic.r;
          const relX = Math.abs(ddx) / (hw || 1);
          const relY = Math.abs(ddy) / (hh || 1);
          if (relX > 0.5 && relY > 0.5) {
            const vs = ddy >= 0 ? 'bottom' : 'top';
            const hs = ddx >= 0 ? 'right' : 'left';
            connectSrcSide = `${vs}-${hs}`;
          } else {
            connectSrcSide = Math.abs(ddx) >= Math.abs(ddy)
              ? (ddx >= 0 ? 'right' : 'left')
              : (ddy >= 0 ? 'bottom' : 'top');
          }
        } else { connectSrcSide = null; }
        document.getElementById(itemId)?.classList.add('connecting-source');
        showConnectingSideDots(); initRubberBand();
      }, LONG_PRESS_MS);
      document.addEventListener('pointermove', onDocMove);
      document.addEventListener('pointerup',   onDocUp);
    }

    function onDocMove(e) {
      if (iState === 'pressing') {
        if (Math.hypot(e.clientX - pressStart.x, e.clientY - pressStart.y) > DRAG_THRESHOLD) {
          clearTimeout(pressTimer);
          iState = 'dragging-item'; draggingId = pressStart.itemId;
        }
      }
      if (iState === 'dragging-item') {
        const item = placedItems.find(i => i.id === draggingId);
        if (item) {
          const r = canvasArea.getBoundingClientRect();
          item.x = Math.max(4, e.clientX - r.left + canvasWrap.scrollLeft - dW(item) / 2);
          item.y = Math.max(4, e.clientY - r.top  + canvasWrap.scrollTop  - iSz(item) / 2);
          const el = document.getElementById(draggingId);
          if (el) { el.style.left = item.x + 'px'; el.style.top = item.y + 'px'; }
          redrawArrows();
          growCanvas(item.x + dW(item) + 20, item.y + iSz(item) + 40);
        }
      }
      if (iState === 'connecting') {
        const r = canvasArea.getBoundingClientRect();
        const cx = e.clientX - r.left + canvasWrap.scrollLeft;
        const cy = e.clientY - r.top  + canvasWrap.scrollTop;
        const snapped = updateHoveredSideDot(cx, cy);
        updateRubberBand(snapped?.x ?? cx, snapped?.y ?? cy);
      }
    }

    function onDocUp(e) {
      document.removeEventListener('pointermove', onDocMove);
      document.removeEventListener('pointerup',   onDocUp);
      if (iState === 'pressing') {
        clearTimeout(pressTimer); iState = 'idle';
        showItemPopup(pressStart.itemId, e.clientX, e.clientY);
        return;
      }
      if (iState === 'dragging-item') { iState = 'idle'; draggingId = null; return; }
      if (iState === 'connecting') {
        const src = connectSrcId, srcSide = connectSrcSide;
        const srcArrowId = connectSrcArrowId, srcArrowPt = connectSrcArrowPt;
        const snapDot = hoveredSideDot; // save BEFORE hideConnectingSideDots clears it
        document.getElementById(src)?.classList.remove('connecting-source');
        hideRubberBand(); hideConnectingSideDots();
        connectSrcId = null; connectSrcSide = null;
        connectSrcArrowId = null; connectSrcArrowPt = null;
        iState = 'idle';

        let targetId = null, targetSide = null;
        if (snapDot) {
          targetId = snapDot.itemId; targetSide = snapDot.side;
        } else {
          const tEl = document.elementFromPoint(e.clientX, e.clientY)?.closest('.placed-item');
          if (tEl && tEl.id !== src) {
            targetId = tEl.id;
            const cr = canvasArea.getBoundingClientRect();
            const cx = e.clientX - cr.left + canvasWrap.scrollLeft;
            const cy = e.clientY - cr.top  + canvasWrap.scrollTop;
            const ic = itemCenter(targetId);
            if (ic) {
              const ddx = cx - ic.x, ddy = cy - ic.y;
              targetSide = Math.abs(ddx) >= Math.abs(ddy)
                ? (ddx >= 0 ? 'right' : 'left') : (ddy >= 0 ? 'bottom' : 'top');
            }
          }
        }

        if (srcArrowId && targetId) {
          // Arrow-anchor: new arrow originates from a point on an existing arrow
          // Block if target is an endpoint of the same arrow (would create a collinear overlap)
          const srcArrow = arrows.find(a => a.id === srcArrowId);
          const isCollinear = srcArrow && (targetId === srcArrow.fromId || targetId === srcArrow.toId);
          if (!isCollinear) {
            const lineType = document.querySelector('input[name="linetype"]:checked')?.value || 'straight';
            arrows.push({ id:`arrow-${nextArrowId++}`, fromId:null, fromArrowId:srcArrowId, fromT:srcArrowPt.t, fromSide:null, toId:targetId, toSide:targetSide, text:'', lineType, hasArrow:true });
            redrawArrows();
          }
        } else if (src && targetId && targetId !== src) {
          createArrow(src, targetId, { fromSide: srcSide, toSide: targetSide });
        }
      }
    }

    // ===== Rubber band =====
    let rubberEl = null;
    function initRubberBand() {
      rubberEl = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      rubberEl.setAttribute('stroke', '#e05a2b'); rubberEl.setAttribute('stroke-width', '2');
      rubberEl.setAttribute('stroke-dasharray', '7,5');
      rubberEl.setAttribute('marker-end', 'url(#arrowhead-end)');
      let sp;
      if (connectSrcArrowId) {
        sp = connectSrcArrowPt ?? { x: 0, y: 0 };
      } else {
        sp = (connectSrcSide ? sideEndpoint(connectSrcId, connectSrcSide) : null)
             ?? (() => { const ic=itemCenter(connectSrcId); return ic ? {x:ic.x,y:ic.y} : {x:0,y:0}; })();
      }
      rubberEl.setAttribute('x1', sp.x); rubberEl.setAttribute('y1', sp.y);
      rubberEl.setAttribute('x2', sp.x); rubberEl.setAttribute('y2', sp.y);
      arrowSvg.appendChild(rubberEl);
    }
    function updateRubberBand(x, y) {
      if (!rubberEl) return;
      rubberEl.setAttribute('x2', x); rubberEl.setAttribute('y2', y);
    }
    function hideRubberBand() { rubberEl?.remove(); rubberEl = null; }

    // ===== ③ Arrow endpoints: rectangle border intersection =====
    function itemCenter(itemId) {
      const it = placedItems.find(i => i.id === itemId); if (!it) return null;
      if (it.type === 'junction') {
        const r = JUNCTION_SZ / 2;
        return { x: it.x + r, y: it.y + r, r };
      }
      const r = iSz(it) / 2;
      return { x: it.x + dW(it) / 2, y: it.y + r, r };
    }

    // ===== Side connection points =====
    function sideEndpoint(itemId, side) {
      const it = placedItems.find(i => i.id === itemId); if (!it || !side) return null;
      const ic = itemCenter(itemId); if (!ic) return null;
      const hw = iSz(it) / 2, hh = ic.r;
      if (side === 'top')          return { x: ic.x,      y: ic.y - hh };
      if (side === 'bottom')       return { x: ic.x,      y: ic.y + hh };
      if (side === 'left')         return { x: ic.x - hw, y: ic.y      };
      if (side === 'right')        return { x: ic.x + hw, y: ic.y      };
      if (side === 'top-left')     return { x: ic.x - hw, y: ic.y - hh };
      if (side === 'top-right')    return { x: ic.x + hw, y: ic.y - hh };
      if (side === 'bottom-left')  return { x: ic.x - hw, y: ic.y + hh };
      if (side === 'bottom-right') return { x: ic.x + hw, y: ic.y + hh };
      return null;
    }

    function getSideDots(itemId) {
      const it = placedItems.find(i => i.id === itemId);
      if (!it || it.type === 'junction') return [];
      const ic = itemCenter(itemId); if (!ic) return [];
      const hw = dW(it) / 2, hh = ic.r;
      return [
        { side: 'top',          x: ic.x,      y: ic.y - hh },
        { side: 'bottom',       x: ic.x,      y: ic.y + hh },
        { side: 'left',         x: ic.x - hw, y: ic.y      },
        { side: 'right',        x: ic.x + hw, y: ic.y      },
        { side: 'top-left',     x: ic.x - hw, y: ic.y - hh },
        { side: 'top-right',    x: ic.x + hw, y: ic.y - hh },
        { side: 'bottom-left',  x: ic.x - hw, y: ic.y + hh },
        { side: 'bottom-right', x: ic.x + hw, y: ic.y + hh },
      ];
    }

    function showConnectingSideDots() {
      sideDotEls = [];
      placedItems.forEach(item => {
        getSideDots(item.id).forEach(dot => {
          const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          c.setAttribute('cx', dot.x); c.setAttribute('cy', dot.y); c.setAttribute('r', '6');
          c.setAttribute('fill', '#4a90e2'); c.setAttribute('stroke', '#fff');
          c.setAttribute('stroke-width', '1.5'); c.setAttribute('opacity', '0.9');
          c.classList.add('side-dot');
          c.dataset.itemId = item.id; c.dataset.side = dot.side;
          c.style.pointerEvents = 'none';
          arrowSvg.appendChild(c); sideDotEls.push(c);
        });
      });
    }

    function hideConnectingSideDots() {
      sideDotEls.forEach(el => el.remove()); sideDotEls = []; hoveredSideDot = null;
    }

    function updateHoveredSideDot(canvasX, canvasY) {
      let best = null, bestD = 52;
      placedItems.forEach(item => {
        if (item.id === connectSrcId || item.type === 'junction') return;
        getSideDots(item.id).forEach(dot => {
          const d = Math.hypot(canvasX - dot.x, canvasY - dot.y);
          if (d < bestD) { bestD = d; best = { itemId: item.id, side: dot.side, x: dot.x, y: dot.y }; }
        });
      });
      hoveredSideDot = best;
      sideDotEls.forEach(el => {
        const h = el.dataset.itemId === best?.itemId && el.dataset.side === best?.side;
        el.setAttribute('r', h ? '9' : '6');
        el.setAttribute('fill', h ? '#e05a2b' : '#4a90e2');
      });
      return best;
    }

    // Compute 7 evenly spaced midpoint dots along a rendered arrow
    // 5 evenly-spaced midpoint dots; each entry includes normalized t (0–1 along rendered path)
    function getMidpointDots(p1, p2, isElbow, corners) {
      const pts = [];
      const N = 5;
      if (isElbow && corners.length > 0) {
        const allPts = [p1, ...corners, p2];
        const segs = [];
        for (let i = 0; i < allPts.length - 1; i++) {
          const a = allPts[i], b = allPts[i+1];
          segs.push({ a, b, len: Math.hypot(b.x-a.x, b.y-a.y) });
        }
        const total = segs.reduce((s, sg) => s + sg.len, 0) || 1;
        for (let k = 1; k <= N; k++) {
          const tGlobal = k / (N + 1);
          let rem = tGlobal * total;
          for (const sg of segs) {
            if (rem <= sg.len + 1e-9 || sg === segs[segs.length - 1]) {
              const tt = sg.len > 0 ? Math.min(rem / sg.len, 1) : 0;
              pts.push({ x: sg.a.x + tt*(sg.b.x-sg.a.x), y: sg.a.y + tt*(sg.b.y-sg.a.y), t: tGlobal });
              break;
            }
            rem -= sg.len;
          }
        }
      } else {
        for (let k = 1; k <= N; k++) {
          const t = k / (N + 1);
          pts.push({ x: p1.x + t*(p2.x-p1.x), y: p1.y + t*(p2.y-p1.y), t });
        }
      }
      return pts;
    }

    // Compute actual rendered path endpoints+corners for an arrow (mirrors redrawArrows logic)
    function getArrowPath(arrowId, depth = 0) {
      if (depth > 8) return null;
      const src = arrows.find(a => a.id === arrowId);
      if (!src || !src.toId) return null;
      const fromCenter = src.fromArrowId != null
        ? (() => { const pt = computeArrowAnchor(src.fromArrowId, src.fromT ?? 0.5, depth + 1); return pt ? { x: pt.x, y: pt.y, r: 1 } : null; })()
        : itemCenter(src.fromId);
      const toCenter = itemCenter(src.toId);
      if (!fromCenter || !toCenter) return null;
      const hasReverse = arrows.some(a => a.fromId === src.toId && a.toId === src.fromId);
      const offset = hasReverse ? 8 : 0;
      const dx0 = toCenter.x - fromCenter.x, dy0 = toCenter.y - fromCenter.y;
      const d0 = Math.hypot(dx0, dy0) || 1;
      const ox = (dy0/d0)*offset, oy = -(dx0/d0)*offset;
      const p1 = src.fromArrowId != null
        ? (computeArrowAnchor(src.fromArrowId, src.fromT ?? 0.5, depth + 1) ?? { x: fromCenter.x, y: fromCenter.y })
        : src.fromSide
        ? (() => { const pt = sideEndpoint(src.fromId, src.fromSide); return pt ? { x: pt.x+ox, y: pt.y+oy } : { x: fromCenter.x+ox, y: fromCenter.y+oy }; })()
        : (() => { const fcx=fromCenter.x+ox, fcy=fromCenter.y+oy, tcx=toCenter.x+ox, tcy=toCenter.y+oy; const dx=tcx-fcx, dy=tcy-fcy, d=Math.hypot(dx,dy)||1; return rectBorder(fcx, fcy, fromCenter.r, dx/d, dy/d); })();
      const p2 = src.toSide
        ? (() => { const pt = sideEndpoint(src.toId, src.toSide); return pt ? { x: pt.x+ox, y: pt.y+oy } : { x: toCenter.x+ox, y: toCenter.y+oy }; })()
        : (() => { const fcx=fromCenter.x+ox, fcy=fromCenter.y+oy, tcx=toCenter.x+ox, tcy=toCenter.y+oy; const dx=tcx-fcx, dy=tcy-fcy, d=Math.hypot(dx,dy)||1; return rectBorder(tcx, tcy, toCenter.r, -dx/d, -dy/d); })();
      let corners = [];
      if (src.lineType === 'elbow') {
        const exitHoriz = src.fromSide === 'left' || src.fromSide === 'right' ? true
                        : src.fromSide === 'top'  || src.fromSide === 'bottom' ? false
                        : Math.abs(p2.x - p1.x) >= Math.abs(p2.y - p1.y);
        if ((src.bends ?? 1) === 2) {
          if (exitHoriz) { const midX=(p1.x+p2.x)/2; corners=[{x:midX,y:p1.y},{x:midX,y:p2.y}]; }
          else           { const midY=(p1.y+p2.y)/2; corners=[{x:p1.x,y:midY},{x:p2.x,y:midY}]; }
        } else {
          if (exitHoriz) corners=[{x:p2.x,y:p1.y}];
          else           corners=[{x:p1.x,y:p2.y}];
        }
      }
      return { p1, p2, corners, isElbow: src.lineType === 'elbow' };
    }

    // Compute a point at parameter t (0–1) along a rendered arrow (used for arrow-anchor arrows)
    function computeArrowAnchor(arrowId, t, depth = 0) {
      if (depth > 8) return null;
      const path = getArrowPath(arrowId, depth);
      if (!path) return null;
      const { p1, p2, corners, isElbow } = path;
      if (isElbow && corners.length > 0) {
        // Interpolate along elbow path by arc-length
        const allPts = [p1, ...corners, p2];
        const segs = [];
        for (let i = 0; i < allPts.length - 1; i++) {
          const a = allPts[i], b = allPts[i+1];
          segs.push({ a, b, len: Math.hypot(b.x-a.x, b.y-a.y) });
        }
        const total = segs.reduce((s, sg) => s + sg.len, 0) || 1;
        let rem = t * total;
        for (const sg of segs) {
          if (rem <= sg.len + 1e-9 || sg === segs[segs.length - 1]) {
            const tt = sg.len > 0 ? Math.min(rem / sg.len, 1) : 0;
            return { x: sg.a.x + tt*(sg.b.x-sg.a.x), y: sg.a.y + tt*(sg.b.y-sg.a.y) };
          }
          rem -= sg.len;
        }
      }
      return { x: p1.x + t*(p2.x - p1.x), y: p1.y + t*(p2.y - p1.y) };
    }

    // Point on rectangle border (square with half-side r) toward direction (ux,uy) from center
    function rectBorder(cx, cy, r, ux, uy) {
      const ax = Math.abs(ux), ay = Math.abs(uy);
      const maxA = Math.max(ax, ay);
      if (maxA < 1e-9) return { x: cx, y: cy };
      const t = r / maxA;
      return { x: cx + ux * t, y: cy + uy * t };
    }

    function createArrow(fromId, toId, opts = {}) {
      if (arrows.some(a => a.fromId === fromId && a.toId === toId)) return;
      const lineType = opts.lineType ?? (document.querySelector('input[name="linetype"]:checked')?.value || 'straight');
      const hasArrow  = opts.hasArrow  ?? true;
      const fromSide  = opts.fromSide  ?? null;
      const toSide    = opts.toSide    ?? null;
      arrows.push({ id: `arrow-${nextArrowId++}`, fromId, toId, text: '', lineType, hasArrow, fromSide, toSide });
      redrawArrows();
      window._tHook?.('arrow', arrows.length); // TUTORIAL HOOK
    }

    function redrawArrows() {
      arrowSvg.querySelectorAll('.arrow-group').forEach(g => g.remove());
      const PAIR_OFFSET = 8;

      arrows.forEach(arrow => {
        // For arrow-anchor arrows (fromArrowId set), use a pseudo-center from the anchor point
        const fromCenter = arrow.fromArrowId != null
          ? (() => { const pt = computeArrowAnchor(arrow.fromArrowId, arrow.fromT ?? 0.5); return pt ? { x: pt.x, y: pt.y, r: 1 } : null; })()
          : itemCenter(arrow.fromId);
        const toCenter   = itemCenter(arrow.toId);
        if (!fromCenter || !toCenter) return;
        const isElbow = arrow.lineType === 'elbow';

        // Perpendicular offset for bidirectional pairs
        const hasReverse = arrows.some(a => a.fromId === arrow.toId && a.toId === arrow.fromId);
        const offset = hasReverse ? PAIR_OFFSET : 0;
        const dx0 = toCenter.x - fromCenter.x, dy0 = toCenter.y - fromCenter.y;
        const d0  = Math.hypot(dx0, dy0) || 1;
        const ox = (dy0/d0)*offset, oy = -(dx0/d0)*offset;

        // Source endpoint (fromArrowId = anchor on another arrow)
        let p1 = arrow.fromArrowId != null
          ? (computeArrowAnchor(arrow.fromArrowId, arrow.fromT ?? 0.5) ?? { x: fromCenter.x, y: fromCenter.y })
          : arrow.fromSide
          ? (() => { const pt = sideEndpoint(arrow.fromId, arrow.fromSide); return pt ? { x: pt.x+ox, y: pt.y+oy } : { x: fromCenter.x+ox, y: fromCenter.y+oy }; })()
          : (() => {
              const fcx=fromCenter.x+ox, fcy=fromCenter.y+oy, tcx=toCenter.x+ox, tcy=toCenter.y+oy;
              const dx=tcx-fcx, dy=tcy-fcy, d=Math.hypot(dx,dy)||1;
              return rectBorder(fcx, fcy, fromCenter.r, dx/d, dy/d);
            })();

        // Target endpoint
        let p2 = arrow.toSide
          ? (() => { const pt = sideEndpoint(arrow.toId, arrow.toSide); return pt ? { x: pt.x+ox, y: pt.y+oy } : { x: toCenter.x+ox, y: toCenter.y+oy }; })()
          : (() => {
              const fcx=fromCenter.x+ox, fcy=fromCenter.y+oy, tcx=toCenter.x+ox, tcy=toCenter.y+oy;
              const dx=tcx-fcx, dy=tcy-fcy, d=Math.hypot(dx,dy)||1;
              return rectBorder(tcx, tcy, toCenter.r, -dx/d, -dy/d);
            })();

        let pathD = null, corners = [];
        if (isElbow) {
          const exitHoriz = arrow.fromSide === 'left' || arrow.fromSide === 'right' ? true
                          : arrow.fromSide === 'top'  || arrow.fromSide === 'bottom' ? false
                          : Math.abs(p2.x - p1.x) >= Math.abs(p2.y - p1.y);
          if ((arrow.bends ?? 1) === 2) {
            if (exitHoriz) {
              const midX = (p1.x + p2.x) / 2;
              corners = [{ x: midX, y: p1.y }, { x: midX, y: p2.y }];
              pathD = `M ${p1.x},${p1.y} L ${midX},${p1.y} L ${midX},${p2.y} L ${p2.x},${p2.y}`;
            } else {
              const midY = (p1.y + p2.y) / 2;
              corners = [{ x: p1.x, y: midY }, { x: p2.x, y: midY }];
              pathD = `M ${p1.x},${p1.y} L ${p1.x},${midY} L ${p2.x},${midY} L ${p2.x},${p2.y}`;
            }
          } else {
            if (exitHoriz) {
              corners = [{ x: p2.x, y: p1.y }];
              pathD = `M ${p1.x},${p1.y} L ${p2.x},${p1.y} L ${p2.x},${p2.y}`;
            } else {
              corners = [{ x: p1.x, y: p2.y }];
              pathD = `M ${p1.x},${p1.y} L ${p1.x},${p2.y} L ${p2.x},${p2.y}`;
            }
          }
        }

        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.classList.add('arrow-group'); g.dataset.arrowId = arrow.id;
        g.style.pointerEvents = 'all'; g.style.cursor = 'pointer';

        if (isElbow) {
          const hit = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          hit.setAttribute('d', pathD); hit.setAttribute('stroke', 'transparent');
          hit.setAttribute('stroke-width', '16'); hit.setAttribute('fill', 'none');
          g.appendChild(hit);
          const vis = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          vis.setAttribute('d', pathD); vis.setAttribute('stroke', '#555555');
          vis.setAttribute('stroke-width', '2'); vis.setAttribute('fill', 'none');
          if (arrow.hasArrow !== false) vis.setAttribute('marker-end', 'url(#arrowhead-end)');
          g.appendChild(vis);
        } else {
          g.appendChild(makeSvgLine(p1.x, p1.y, p2.x, p2.y, 'transparent', 16));
          const line = makeSvgLine(p1.x, p1.y, p2.x, p2.y, '#555555', 2);
          if (arrow.hasArrow !== false) line.setAttribute('marker-end', 'url(#arrowhead-end)');
          g.appendChild(line);
        }

        if (arrow.text) {
          const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
          const len = arrow.text.length * 7 + 12;

          // Arrow angle for text rotation
          const aRad = Math.atan2(p2.y - p1.y, p2.x - p1.x);
          const aDeg = aRad * 180 / Math.PI;
          // Keep text readable (not upside-down)
          let dispAngle = aDeg, yFlip = 1;
          if (aDeg > 90 || aDeg < -90) { dispAngle = aDeg + 180; yFlip = -1; }

          // Determine above/below: same side as perpendicular offset so paired arrows don't collide
          const localOY = ox * (-Math.sin(aRad)) + oy * Math.cos(aRad);
          const perpOff = (localOY > 0 ? 14 : -14) * yFlip;

          const tGrp = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          tGrp.setAttribute('transform', `rotate(${dispAngle.toFixed(2)},${mx},${my})`);

          const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          bg.setAttribute('x', mx - len/2); bg.setAttribute('y', my + perpOff - 13);
          bg.setAttribute('width', len);    bg.setAttribute('height', 15);
          bg.setAttribute('fill', 'rgba(255,255,255,0.92)'); bg.setAttribute('rx', '3');
          tGrp.appendChild(bg);

          const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          txt.setAttribute('x', mx); txt.setAttribute('y', my + perpOff);
          txt.setAttribute('text-anchor', 'middle'); txt.setAttribute('font-size', '14');
          txt.setAttribute('fill', '#333333'); txt.setAttribute('font-family', 'MihoyoZenZero, sans-serif');
          txt.textContent = arrow.text;
          tGrp.appendChild(txt);
          g.appendChild(tGrp);
        }

        // ① 5 midpoint dots — drag from any to branch a new arrow (no junction node)
        getMidpointDots(p1, p2, isElbow, corners).forEach(pt => {
          const dotHit = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          dotHit.setAttribute('cx', pt.x); dotHit.setAttribute('cy', pt.y);
          dotHit.setAttribute('r', '9'); dotHit.setAttribute('fill', 'transparent');
          dotHit.classList.add('midpoint-dot');
          dotHit.style.cursor = 'crosshair'; dotHit.style.pointerEvents = 'all';
          const dotVis = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          dotVis.setAttribute('cx', pt.x); dotVis.setAttribute('cy', pt.y);
          dotVis.setAttribute('r', '4'); dotVis.setAttribute('fill', '#fff');
          dotVis.setAttribute('stroke', '#aaa'); dotVis.setAttribute('stroke-width', '1.5');
          dotVis.setAttribute('opacity', '0.7'); dotVis.style.pointerEvents = 'none';
          dotVis.classList.add('midpoint-dot');
          g.appendChild(dotHit); g.appendChild(dotVis);

          // Drag from midpoint → new arrow anchored to this arrow (no junction node created)
          dotHit.addEventListener('pointerdown', ev => {
            ev.stopPropagation();
            if (iState !== 'idle') return;
            ev.preventDefault();
            iState = 'connecting';
            connectSrcId = null; connectSrcSide = null;
            connectSrcArrowId = arrow.id;
            connectSrcArrowPt = { x: pt.x, y: pt.y, t: pt.t };
            showConnectingSideDots(); initRubberBand();
            document.addEventListener('pointermove', onDocMove);
            document.addEventListener('pointerup',   onDocUp);
          });
        });

        g.addEventListener('click', e => { e.stopPropagation(); showArrowPopup(arrow.id, e.clientX, e.clientY); });
        g.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); showArrowPopup(arrow.id, e.clientX, e.clientY); });
        arrowSvg.appendChild(g);
      });
    }

    function makeSvgLine(x1, y1, x2, y2, stroke, w) {
      const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      l.setAttribute('x1', x1); l.setAttribute('y1', y1);
      l.setAttribute('x2', x2); l.setAttribute('y2', y2);
      l.setAttribute('stroke', stroke); l.setAttribute('stroke-width', w);
      return l;
    }

    // ===== Popup =====
    function hideArrowButtons() {
      popupBidirBtn.style.display        = 'none';
      popupArrowToggleBtn.style.display  = 'none';
      popupArrowReverseBtn.style.display = 'none';
      popupLinetypeBtn.style.display     = 'none';
      popupElbowBendsBtn.style.display   = 'none';
      popupGroupMoveBtn.style.display    = 'none';
      popupGroupResizeBtn.style.display  = 'none';
      popupGroupBorderBtn.style.display  = 'none';
      popupGroupLabelBtn.style.display   = 'none';
    }
    function showItemPopup(itemId, cx, cy) {
      popupTarget = { type: 'item', id: itemId };
      hideArrowButtons();
      const item = placedItems.find(i => i.id === itemId);
      popupResizeRow.style.display = item?.type === 'junction' ? 'none' : '';
      popupColorRow.style.display  = 'none';
      openPopup(cx, cy);
    }
    function showArrowPopup(arrowId, cx, cy) {
      window._tHook?.('arrowPopup'); // TUTORIAL HOOK
      popupTarget = { type: 'arrow', id: arrowId };
      const arrow = arrows.find(a => a.id === arrowId);
      const d = i18n[currentLang] || i18n.ja;
      popupBidirBtn.style.display       = '';
      popupArrowToggleBtn.style.display = '';
      popupArrowToggleBtn.textContent   = (arrow?.hasArrow !== false) ? d.arrowOnToOff : d.arrowOffToOn;
      // 矢印なし状態では逆転は無意味なので非表示
      if (arrow?.hasArrow !== false) {
        popupArrowReverseBtn.style.display = '';
        popupArrowReverseBtn.textContent   = d.arrowReverse;
      } else {
        popupArrowReverseBtn.style.display = 'none';
      }
      // 線種切替ボタン
      popupLinetypeBtn.style.display = '';
      popupLinetypeBtn.textContent   = arrow?.lineType === 'elbow' ? d.elbowToStraight : d.straightToElbow;
      if (arrow?.lineType === 'elbow') {
        popupElbowBendsBtn.style.display = '';
        popupElbowBendsBtn.textContent   = (arrow?.bends ?? 1) === 1 ? d.bends1to2 : d.bends2to1;
      } else {
        popupElbowBendsBtn.style.display = 'none';
      }
      popupResizeRow.style.display = 'none';
      popupColorRow.style.display  = 'none';
      openPopup(cx, cy);
    }
    function showGroupPopup(groupId, cx, cy) {
      popupTarget = { type: 'group', id: groupId };
      hideArrowButtons();
      popupResizeRow.style.display = 'none';
      popupColorRow.style.display  = '';
      popupGroupMoveBtn.style.display   = '';
      popupGroupResizeBtn.style.display = '';
      popupGroupBorderBtn.style.display = '';
      popupGroupLabelBtn.style.display  = '';
      const grp = groups.find(g => g.id === groupId);
      swatchContainer.querySelectorAll('.color-swatch').forEach((s, i) =>
        s.classList.toggle('active', i === (grp?.colorIdx ?? 0)));
      popupGroupBorderBtn.textContent = grp?.hideBorder ? '枠を表示' : '枠を非表示';
      popupGroupLabelBtn.textContent  = grp?.hideLabel  ? 'グループ名を表示' : 'グループ名を非表示';
      openPopup(cx, cy);
    }
    function openPopup(cx, cy) {
      popupMenu.style.display = 'flex';
      requestAnimationFrame(() => {
        const w = popupMenu.offsetWidth || 140, h = popupMenu.offsetHeight || 130;
        let left = cx + 10, top = cy + 10;
        if (left + w > window.innerWidth)  left = cx - w - 10;
        if (top  + h > window.innerHeight) top  = cy - h - 10;
        popupMenu.style.left = Math.max(4, left) + 'px';
        popupMenu.style.top  = Math.max(4, top)  + 'px';
      });
    }
    function closePopup() { popupMenu.style.display = 'none'; popupTarget = null; }

    document.addEventListener('click', e => {
      if (e.target.closest('#popup-menu')) return;
      if (e.target.closest('.placed-item') || e.target.closest('.group-label')) return;
      closePopup();
    });

    popupInputBtn.addEventListener('click', () => {
      if (!popupTarget) return;
      const t = popupTarget; closePopup(); openTextEdit(t);
    });
    popupDeleteBtn.addEventListener('click', () => {
      if (!popupTarget) return;
      if (popupTarget.type === 'item')  deleteItem(popupTarget.id);
      else if (popupTarget.type === 'arrow') deleteArrow(popupTarget.id);
      else if (popupTarget.type === 'group') deleteGroup(popupTarget.id);
      closePopup();
    });

    // ===== グループ 移動 / 大きさ調整 モード =====
    function exitGroupEditMode() {
      if (!groupEditId) return;
      const el = document.getElementById(groupEditId);
      if (el) {
        el.classList.remove('group-move-mode', 'group-resize-mode');
        el.querySelectorAll('.resize-handle, .group-edit-done').forEach(h => h.remove());
        if (el._groupMoveHandler) {
          el.removeEventListener('pointerdown', el._groupMoveHandler);
          delete el._groupMoveHandler;
        }
      }
      groupEditId = null; groupEditMode = null;
    }

    function addDoneBtn(el, groupId) {
      const btn = document.createElement('button');
      btn.className = 'group-edit-done';
      btn.textContent = '✓ 完了';
      btn.addEventListener('click', e => { e.stopPropagation(); exitGroupEditMode(); });
      el.appendChild(btn);
    }

    function enterGroupMoveMode(groupId) {
      exitGroupEditMode();
      groupEditId = groupId; groupEditMode = 'move';
      const grp = groups.find(g => g.id === groupId);
      const el  = document.getElementById(groupId);
      if (!grp || !el) return;
      el.classList.add('group-move-mode');
      addDoneBtn(el, groupId);

      const onDown = e => {
        if (e.button === 2) return;
        if (e.target.closest('.group-label') || e.target.closest('.group-edit-done')) return;
        e.preventDefault(); e.stopPropagation();
        const startX = e.clientX, startY = e.clientY;
        const origX = grp.x, origY = grp.y;
        const onMove = ev => {
          grp.x = Math.max(0, origX + ev.clientX - startX);
          grp.y = Math.max(0, origY + ev.clientY - startY);
          el.style.left = grp.x + 'px'; el.style.top = grp.y + 'px';
        };
        const onUp = () => {
          document.removeEventListener('pointermove', onMove);
          document.removeEventListener('pointerup', onUp);
        };
        document.addEventListener('pointermove', onMove);
        document.addEventListener('pointerup', onUp);
      };
      el._groupMoveHandler = onDown;
      el.addEventListener('pointerdown', onDown);
    }

    function enterGroupResizeMode(groupId) {
      exitGroupEditMode();
      groupEditId = groupId; groupEditMode = 'resize';
      const grp = groups.find(g => g.id === groupId);
      const el  = document.getElementById(groupId);
      if (!grp || !el) return;
      el.classList.add('group-resize-mode');
      addDoneBtn(el, groupId);

      ['nw','n','ne','e','se','s','sw','w'].forEach(dir => {
        const h = document.createElement('div');
        h.className = `resize-handle rh-${dir}`;
        el.appendChild(h);
        h.addEventListener('pointerdown', e => {
          e.stopPropagation(); e.preventDefault();
          h.setPointerCapture(e.pointerId);
          const startX = e.clientX, startY = e.clientY;
          const orig = { x: grp.x, y: grp.y, w: grp.w, h: grp.h };
          const onMove = ev => {
            const dx = ev.clientX - startX, dy = ev.clientY - startY;
            if (dir.includes('e')) grp.w = Math.max(60, orig.w + dx);
            if (dir.includes('s')) grp.h = Math.max(40, orig.h + dy);
            if (dir.includes('w')) { grp.x = orig.x + dx; grp.w = Math.max(60, orig.w - dx); if (grp.w === 60) grp.x = orig.x + orig.w - 60; }
            if (dir.includes('n')) { grp.y = orig.y + dy; grp.h = Math.max(40, orig.h - dy); if (grp.h === 40) grp.y = orig.y + orig.h - 40; }
            el.style.left = grp.x + 'px'; el.style.top    = grp.y + 'px';
            el.style.width = grp.w + 'px'; el.style.height = grp.h + 'px';
          };
          const onUp = () => {
            document.removeEventListener('pointermove', onMove);
            document.removeEventListener('pointerup', onUp);
          };
          document.addEventListener('pointermove', onMove);
          document.addEventListener('pointerup', onUp);
        });
      });
    }

    popupGroupMoveBtn.addEventListener('click', () => {
      if (!popupTarget || popupTarget.type !== 'group') return;
      const id = popupTarget.id; closePopup();
      enterGroupMoveMode(id);
    });
    popupGroupResizeBtn.addEventListener('click', () => {
      if (!popupTarget || popupTarget.type !== 'group') return;
      const id = popupTarget.id; closePopup();
      enterGroupResizeMode(id);
    });

    // グループ：枠表示切替
    popupGroupBorderBtn.addEventListener('click', () => {
      if (!popupTarget || popupTarget.type !== 'group') return;
      const grp = groups.find(g => g.id === popupTarget.id); if (!grp) return;
      grp.hideBorder = !grp.hideBorder;
      const el = document.getElementById(grp.id); if (el) el.style.borderColor = grp.hideBorder ? 'transparent' : GROUP_COLORS[grp.colorIdx ?? 0].border;
      popupGroupBorderBtn.textContent = grp.hideBorder ? '枠を表示' : '枠を非表示';
    });

    // グループ：ラベル表示切替
    popupGroupLabelBtn.addEventListener('click', () => {
      if (!popupTarget || popupTarget.type !== 'group') return;
      const grp = groups.find(g => g.id === popupTarget.id); if (!grp) return;
      grp.hideLabel = !grp.hideLabel;
      const el = document.getElementById(grp.id);
      const lbl = el?.querySelector('.group-label'); if (lbl) lbl.style.display = grp.hideLabel ? 'none' : '';
      popupGroupLabelBtn.textContent = grp.hideLabel ? 'グループ名を表示' : 'グループ名を非表示';
    });

    // 双方向 = create reverse arrow (separate, new arrow)
    popupBidirBtn.addEventListener('click', () => {
      if (!popupTarget || popupTarget.type !== 'arrow') return;
      const arrow = arrows.find(a => a.id === popupTarget.id);
      if (arrow) createArrow(arrow.toId, arrow.fromId, { lineType: arrow.lineType, hasArrow: arrow.hasArrow, fromSide: arrow.toSide, toSide: arrow.fromSide });
      closePopup();
    });

    // 矢印あり/なし トグル
    popupArrowToggleBtn.addEventListener('click', () => {
      if (!popupTarget || popupTarget.type !== 'arrow') return;
      const arrow = arrows.find(a => a.id === popupTarget.id);
      if (arrow) {
        arrow.hasArrow = !arrow.hasArrow;
        redrawArrows();
        const d = i18n[currentLang] || i18n.ja;
        popupArrowToggleBtn.textContent = arrow.hasArrow ? d.arrowOnToOff : d.arrowOffToOn;
        // 矢印なし時は逆転ボタンを隠す
        popupArrowReverseBtn.style.display = arrow.hasArrow ? '' : 'none';
      }
    });

    // 矢印逆転
    popupArrowReverseBtn.addEventListener('click', () => {
      if (!popupTarget || popupTarget.type !== 'arrow') return;
      const arrow = arrows.find(a => a.id === popupTarget.id);
      if (arrow) {
        [arrow.fromId,   arrow.toId  ] = [arrow.toId,   arrow.fromId  ];
        [arrow.fromSide, arrow.toSide] = [arrow.toSide, arrow.fromSide];
        redrawArrows();
      }
      closePopup();
    });

    // 線種切替（直線⇄カクカク）
    popupLinetypeBtn.addEventListener('click', () => {
      if (!popupTarget || popupTarget.type !== 'arrow') return;
      const arrow = arrows.find(a => a.id === popupTarget.id);
      if (arrow) {
        arrow.lineType = arrow.lineType === 'elbow' ? 'straight' : 'elbow';
        redrawArrows();
        const d = i18n[currentLang] || i18n.ja;
        popupLinetypeBtn.textContent = arrow.lineType === 'elbow' ? d.elbowToStraight : d.straightToElbow;
        // カクカクの場合のみ折れ数ボタンを表示
        if (arrow.lineType === 'elbow') {
          popupElbowBendsBtn.style.display = '';
          popupElbowBendsBtn.textContent   = (arrow.bends ?? 1) === 1 ? d.bends1to2 : d.bends2to1;
        } else {
          popupElbowBendsBtn.style.display = 'none';
        }
      }
    });

    // カクカク折れ数切り替え
    popupElbowBendsBtn.addEventListener('click', () => {
      if (!popupTarget || popupTarget.type !== 'arrow') return;
      const arrow = arrows.find(a => a.id === popupTarget.id);
      if (arrow) {
        arrow.bends = (arrow.bends ?? 1) === 1 ? 2 : 1;
        redrawArrows();
        const d = i18n[currentLang] || i18n.ja;
        popupElbowBendsBtn.textContent = arrow.bends === 1 ? d.bends1to2 : d.bends2to1;
      }
    });

    // 中継点を追加 — arrowの中間にjunction nodeを置き、矢印を分割
    popupMenu.querySelector('#popup-enlarge-btn').addEventListener('click', () => {
      if (!popupTarget || popupTarget.type !== 'item') return;

      if (item) { item.scale = Math.min(4.0, (item.scale || 1) * 1.25); applyItemSize(item.id); }

    popupMenu.querySelector('#popup-shrink-btn').addEventListener('click', () => {
      if (!popupTarget || popupTarget.type !== 'item') return;

    function openTextEdit(target) {
      textEditTarget = target;
      let cur = '';
      if (target.type === 'item') cur = placedItems.find(i => i.id === target.id)?.text || '';
      else if (target.type === 'arrow') cur = arrows.find(a => a.id === target.id)?.text || '';
      else if (target.type === 'group') cur = groups.find(g => g.id === target.id)?.label || '';
      textEditInput.value = cur;

      let left = window.innerWidth/2 - 115, top = window.innerHeight/2 - 50;
      if (target.type === 'item') {
        const el = document.getElementById(target.id);
        if (el) { const r = el.getBoundingClientRect(); left = r.left; top = r.bottom + 8; }
